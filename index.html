  --bg1:#f1faff;--bg2:#e9f4ff;--bg3:#f4f9ff;
  --surface:#ffffff;--surface2:#f1f8ff;--text:#33465f;--muted:#7a8ea8;--line:#cfe6f7;
  --c:#5aa9e6;--cd:#2f7fc0;
  --mint:#7fd8be;--mint-d:#1f5b4a;--pink:#ffa6c1;--pink-d:#7a2448;--blue:#5aa9e6;--blue-d:#3b8fd4;
  --shadow:0 18px 40px rgba(90,150,210,.28);
  --head:"Fredoka","Nunito","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Nunito","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);
  background:
   radial-gradient(circle,rgba(110,175,240,.16) 2.5px,transparent 3px) 0 0/34px 34px,
   linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-attachment:fixed;
  display:flex;flex-direction:column;align-items:center;padding:12px 16px 10px;gap:10px;overflow:hidden;height:100vh;height:-webkit-fill-available;height:100dvh;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco span{position:absolute;opacity:.6;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-24px) rotate(8deg)}}
.deco span:nth-child(1){left:4%;top:10%;font-size:40px}
.deco span:nth-child(2){right:5%;top:16%;font-size:34px;animation-delay:-2s}
.deco span:nth-child(3){left:7%;bottom:16%;font-size:32px;animation-delay:-4s}
.deco span:nth-child(4){right:6%;bottom:9%;font-size:44px;animation-delay:-6s}
.deco span:nth-child(5){left:46%;top:3%;font-size:24px;animation-delay:-3s}
.deco span:nth-child(6){left:2%;top:50%;font-size:28px;animation-delay:-5s}
.deco span:nth-child(7){right:3%;top:52%;font-size:30px;animation-delay:-1s}
.deco span:nth-child(8){left:30%;bottom:3%;font-size:26px;animation-delay:-7s}
header,.bar,.scene,.ctrl,.kb{position:relative;z-index:1}
header{flex:none;width:100%;max-width:800px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.8);background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:3px dashed var(--c);border-radius:999px;padding:6px 18px;box-shadow:0 6px 16px rgba(90,150,210,.15);transition:border-color .4s}
h1{font-family:var(--head);font-size:1.1rem;margin:0;font-weight:600;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
h1 .em{display:inline-block;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg) scale(1.15)}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.84rem;font-weight:800;padding:5px 13px;border-radius:999px;background:var(--surface2);border:2px solid var(--line)}
.chip.k{background:var(--mint);color:var(--mint-d);border-color:transparent}
.chip.u{background:var(--pink);color:var(--pink-d);border-color:transparent}
.bar{flex:none;width:100%;max-width:800px;height:16px;background:var(--surface);border:3px solid var(--line);border-radius:999px;display:flex;box-shadow:inset 0 3px 6px rgba(90,150,210,.15);position:relative;overflow:visible}
.bar .track{position:absolute;inset:0;border-radius:999px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .6s cubic-bezier(.3,.8,.3,1)}
.bar .k{background:repeating-linear-gradient(45deg,var(--mint),var(--mint) 10px,#a4ecd7 10px,#a4ecd7 20px)}
.bar .u{background:repeating-linear-gradient(45deg,var(--pink),var(--pink) 10px,#ffc7d9 10px,#ffc7d9 20px)}
.bar .star{position:absolute;right:-10px;top:-12px;font-size:24px;animation:wob 3s ease-in-out infinite}
.scene{width:100%;max-width:800px;flex:1 1 0;min-height:0;perspective:1800px;margin-top:4px}
.scene.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:translateY(22px) scale(.92) rotate(-1.5deg);opacity:.2}100%{transform:none;opacity:1}}
.card{position:absolute;top:0;right:0;bottom:0;left:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.card.spin{animation:flipx .5s ease-in-out}
@keyframes flipx{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.card .front{visibility:visible;transition:visibility 0s .25s}
.card .back{visibility:hidden;transition:visibility 0s .25s}
.card.flip .front{visibility:hidden}
.card.flip .back{visibility:visible}
.card.nt .face{transition:none}
.face{position:absolute;inset:0;border-radius:38px;padding:30px 34px;display:flex;flex-direction:column;overflow:hidden;
  border:4px solid var(--c);box-shadow:var(--shadow),0 0 0 7px var(--surface)}
.face{margin:7px;inset:7px;}
.front{padding-bottom:104px;background-color:#f3faff;background-image:radial-gradient(circle,rgba(110,175,240,.3) 3.5px,transparent 4px);background-size:26px 26px;background:
   radial-gradient(circle,color-mix(in srgb,var(--c) 26%,transparent) 3.5px,transparent 4px) 0 0/26px 26px,
   color-mix(in srgb,var(--c) 9%,var(--surface))}
.back{background:var(--surface)}
.tape{background:#bfe3fb;position:absolute;left:50%;top:-12px;width:130px;height:34px;transform:translateX(-50%) rotate(-3deg);z-index:3;border-radius:6px;
  background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--c) 70%,#fff) 0 10px,color-mix(in srgb,var(--c) 40%,#fff) 10px 20px);opacity:.85;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.spark{position:absolute;font-size:22px;animation:tw 2.6s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{transform:scale(.7) rotate(0);opacity:.5}50%{transform:scale(1.2) rotate(20deg);opacity:1}}
.tag{display:inline-flex;align-self:flex-start;gap:10px;align-items:center;font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 16px;border-radius:999px;margin-bottom:14px;margin-top:6px;
  background:var(--c);color:#fff;text-shadow:0 1px 0 var(--cd);position:relative;z-index:2}
.tag b{background:#fff;color:var(--cd);text-shadow:none;border-radius:999px;padding:1px 9px}
.qtxt{margin:auto 0;font-family:var(--head);font-weight:500;font-size:1.7rem;line-height:1.55;position:relative;z-index:2;overflow-y:auto;max-height:68%;padding:4px 4px}
.qtxt.s{font-size:1.4rem}.qtxt.xs{font-size:1.2rem}
.hint{font-size:.88rem;color:var(--muted);font-weight:800;position:absolute;left:34px;bottom:26px;z-index:2;max-width:calc(100% - 340px)}
.mascot{position:absolute;right:22px;bottom:14px;width:78px;z-index:2;animation:bob 3.2s ease-in-out infinite}
.mascot svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 6px rgba(60,100,150,.18))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
.bubble{position:absolute;right:112px;bottom:46px;z-index:3;background:#fff;color:#33465f;font-weight:800;font-size:.8rem;padding:6px 12px;border-radius:16px;border:3px solid var(--c);max-width:170px;text-align:center;animation:bob 3.2s ease-in-out infinite;animation-delay:-1s}
.bubble::after{content:"";position:absolute;right:-9px;top:50%;margin-top:-7px;width:12px;height:12px;background:#fff;border-right:3px solid var(--c);border-top:3px solid var(--c);transform:rotate(45deg)}
.mini{position:absolute;right:20px;top:16px;width:56px;z-index:2;animation:bob 3s ease-in-out infinite}
.mini svg{width:100%;height:auto;display:block}
.blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ans{--fs:17px;--lh:34px;overflow-y:auto;flex:1;min-height:0;padding:2px 8px 4px 0;font-size:var(--fs);line-height:var(--lh);font-weight:700;position:relative;z-index:2;background:repeating-linear-gradient(transparent 0 calc(var(--lh) - 2px),color-mix(in srgb,var(--c) 22%,transparent) calc(var(--lh) - 2px) var(--lh)) local}
.ans::-webkit-scrollbar{width:9px}.ans::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--c) 45%,transparent);border-radius:9px}
.miniq{font-family:var(--head);font-weight:500;font-size:calc(var(--fs) * .92);line-height:1.4;color:var(--cd);background:#eef7ff;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:2px dashed var(--c);border-radius:18px;padding:9px 14px;margin:0 66px calc(var(--lh) - 28px) 0}
.it{position:relative;margin:0;padding-top:0}
.it.b{padding-left:1.5em}
.it.b::before{content:"♥";position:absolute;left:.15em;top:0;font-size:.8em;color:var(--c)}
.l1{margin-left:1.2em}.l2{margin-left:2.4em}.l3{margin-left:3.6em}.l4{margin-left:4.8em}
.l1.b::before{color:var(--mint)}.l2.b::before,.l3.b::before{color:var(--pink)}
.ctrl{flex:none;width:100%;max-width:800px;display:flex;flex-wrap:nowrap;gap:10px;justify-content:center}
.ctrl.sec button{font-size:.8rem;padding:6px 14px;border-width:2px;box-shadow:0 3px 0 var(--line)}
.ctrl.sec button:hover{box-shadow:0 5px 0 var(--line)}
button{font-family:inherit;font-weight:800;font-size:.95rem;padding:9px 20px;white-space:nowrap;border-radius:999px;border:3px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;
  box-shadow:0 5px 0 var(--line);transition:transform .12s,box-shadow .12s;position:relative}
button:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:0 8px 0 var(--line)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
button.know{background:var(--mint);color:var(--mint-d);border-color:transparent;box-shadow:0 5px 0 #5fb99e}
button.dont{background:var(--pink);color:var(--pink-d);border-color:transparent;box-shadow:0 5px 0 #e888a6}
button.pri{background:var(--blue);color:#fff;border-color:transparent;box-shadow:0 5px 0 var(--blue-d)}
button.know:hover{box-shadow:0 8px 0 #5fb99e}button.dont:hover{box-shadow:0 8px 0 #e888a6}button.pri:hover{box-shadow:0 8px 0 var(--blue-d)}
button.know:active,button.dont:active,button.pri:active{box-shadow:0 1px 0 rgba(0,0,0,.2)}
.kb{flex:none;font-size:.72rem;color:var(--muted);font-weight:700;text-align:center}
.done{display:none;position:absolute;inset:7px;background:var(--surface);border:4px dashed var(--c);border-radius:38px;box-shadow:var(--shadow);flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;z-index:5}
.done h2{margin:0;font-family:var(--head);font-weight:600;font-size:1.7rem}
.done .big{font-size:4.2rem;animation:bob 2s ease-in-out infinite}
.sum{color:var(--muted);font-weight:800}
.fall,.rise{position:fixed;z-index:50;pointer-events:none}
.fall{top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
.rise{font-size:24px;animation:rise 1.1s ease-out forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),-130px) scale(1.3) rotate(var(--r));opacity:0}}
@media (max-width:560px){
  body{padding:8px 8px 8px;gap:7px}.ctrl{gap:6px}.ctrl button{font-size:.78rem;padding:8px 9px}.ctrl.sec{gap:4px}.ctrl.sec button{font-size:.66rem;padding:5px 6px;flex:0 1 auto}.kb{display:none}
  header{padding:5px 12px}.chip{font-size:.74rem;padding:3px 8px}h1 .em:last-child{display:none}
  .face{padding:22px 20px}.qtxt{font-size:1.35rem}.qtxt.s{font-size:1.15rem}.qtxt.xs{font-size:1.02rem}
  .front{padding-bottom:84px}.mascot{width:60px;right:16px;bottom:12px}.bubble{display:none}.hint{max-width:calc(100% - 110px);font-size:.8rem;left:20px;bottom:22px}
  .mini{width:44px}.miniq{margin-right:52px;font-size:.92rem}
  h1{font-size:.84rem}
}
</style>
<style>
#pwaBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:50;display:none;align-items:center;gap:8px;background:#fff;color:#245;border:2px solid #9cc9f5;border-radius:999px;padding:8px 14px;font:600 .8rem system-ui,sans-serif;box-shadow:0 4px 14px rgba(60,120,200,.25);cursor:pointer}
#pwaBtn img{width:22px;height:22px;border-radius:6px}
#pwaBtn .x{opacity:.5;margin-left:4px;padding:0 4px}
#pwaTip{position:fixed;inset:auto 12px calc(60px + env(safe-area-inset-bottom,0px)) 12px;z-index:51;display:none;background:#fff;border:2px solid #9cc9f5;border-radius:16px;padding:12px 14px;font:.85rem/1.45 system-ui,sans-serif;color:#245;box-shadow:0 6px 20px rgba(60,120,200,.3)}
</style>
</head>
<body>
<div class="deco"><span>☁️</span><span>⭐</span><span>🫧</span><span>🐋</span><span>✨</span><span>💙</span><span>🌊</span><span>🦋</span></div>
<header>
  <h1><span class="em">🎀</span>Flashcard – Truyền thông đại chúng<span class="em">✨</span></h1>
  <div class="chips"><span class="chip">🃏 <b id="pos">0</b>/<b id="tot">0</b></span><span class="chip k">✅ <b id="kn">0</b></span><span class="chip u">💭 <b id="un">0</b></span></div>
</header>
<div class="bar"><div class="track"><i class="k" id="bk"></i><i class="u" id="bu"></i></div><span class="star">⭐</span></div>

<div class="scene" id="scene">
  <div class="card" id="card">
    <div class="face front">
      <div class="tape"></div>
      <span class="spark" style="left:18px;bottom:70px">✨</span><span class="spark" style="right:150px;top:22px;animation-delay:-1s">⭐</span><span class="spark" style="left:46%;bottom:22px;animation-delay:-2s;font-size:16px">💖</span>
      <div class="tag"><b id="fnum"></b><span>Câu hỏi</span></div>
      <div class="qtxt" id="q"></div>
      <div class="hint">🦔 Chạm vào thẻ hoặc nhấn Space để lật</div>
      <div class="bubble" id="bubble">Nhớ chưa nè? 🤔</div>
      <div class="mascot" id="mascot"></div>
    </div>
    <div class="face back">
      <div class="tape"></div>
      <div class="tag"><b id="bnum"></b><span>Đáp án</span></div>
      <div class="mini" id="mini"></div>
      <div class="ans" id="a"></div>
    </div>
  </div>
  <div class="done" id="done"><div class="big">🎉</div><h2>Giỏi quá, xong một vòng rồi! 🌈</h2><div id="sum" class="sum"></div><div class="ctrl"><button class="pri" id="again">🔀 Học lại (xáo trộn)</button><button id="redo">💭 Ôn thẻ chưa thuộc</button></div></div>
</div>

<div class="ctrl">
  <button id="prev">← Trước</button>
  <button class="dont" id="bdont">💭 Chưa thuộc</button>
  <button class="know" id="bknow">✅ Đã thuộc</button>
  <button id="next">Sau →</button>
</div>
<div class="ctrl sec">
  <button class="pri" id="shuf">🔀 Xáo trộn</button>
  <button id="only">💭 Thẻ chưa thuộc</button>
  <button id="all">🃏 Tất cả 10 thẻ</button>
  <button id="rst">🧹 Đặt lại</button>
</div>
<div class="kb">Phím tắt: Space/Enter = lật · ← → = chuyển thẻ · K = đã thuộc · D = chưa thuộc · S = xáo trộn</div>

<script>
const CARDS = [{"n": 11, "q": "Có bao nhiêu thành phần nhận thức tham gia vào trải nghiệm truyền thông của chúng ta?", "a": [{"l": 0, "b": true, "t": "Các thành phần nhận thức chính trong trải nghiệm truyền thông bao gồm: Sự chú ý (Attention), Sự gác lại sự hoài nghi (Suspending Disbelief), Sự thăng hoa/cuốn hút vào cốt truyện (Transportation), và Sự đồng hóa/nhận diện nhân vật (Identification)."}]}, {"n": 12, "q": "Mối quan hệ cận xã hội với truyền thông (parasocial relationship) là gì? Lấy ví dụ và chỉ ra ưu, nhược điểm?", "a": [{"l": 0, "b": true, "t": "Khái niệm: Là mối quan hệ một chiều mà khán giả ảo tưởng hoặc cảm thấy mình có sự gắn kết thân thiết, gắn bó tâm lý với một nhân vật truyền thông, người nổi tiếng hoặc phát thanh viên mà họ không có sự tương tác trực tiếp ngoài đời."}, {"l": 0, "b": true, "t": "Ví dụ: Cảm thấy rất thân thiết, quý mến một Youtuber hoặc diễn viên truyền hình xem hằng ngày."}, {"l": 0, "b": true, "t": "Ưu điểm: Mang lại sự đồng hành, giải trí, thỏa mãn nhu cầu tâm lý xã hội cho người xem."}, {"l": 0, "b": true, "t": "Nhược điểm: Có thể dẫn đến ảo tưởng quá mức, gây hụt hẫng nặng nề, hoặc trong các trường hợp cực đoan có thể biến tướng thành hành vi ám ảnh, đeo bám nguy hiểm (như một số vụ việc fan quá khích được đề cập trong sách)."}]}, {"n": 13, "q": "Tại sao chúng ta cho rằng truyền thông mang lại cho chúng ta trải nghiệm cảm xúc gián tiếp (vicarious emotional experience)? Cho ví dụ minh họa.", "a": [{"l": 0, "b": true, "t": "Vì khi xem các chương trình truyền thông (như phim kinh dị, phim hình sự), chúng ta có thể cảm nhận được nỗi sợ hãi, sự hồi hộp hay căm giận của nhân vật mà không phải chịu bất kỳ hiểm họa vật lý thực tế nào."}, {"l": 0, "b": true, "t": "Ví dụ: Xem phim The Silence of the Lambs, người xem cảm thấy hồi hộp, căng thẳng nhưng đang ngồi an toàn trên ghế sofa ở nhà chứ không bị sát nhân tấn công thật."}]}, {"n": 14, "q": "Sự hài hước được thể hiện như thế nào ở các quốc gia khác nhau và yếu tố cấu thành là gì?", "a": [{"l": 0, "b": true, "t": "Sự hài hước phụ thuộc nhiều vào bối cảnh văn hóa của từng quốc gia (khác biệt về ngôn ngữ, chuẩn mực xã hội)."}, {"l": 0, "b": true, "t": "Yếu tố cấu thành: Hầu hết sự hài hước đều dựa trên sự bất đồng bộ, mâu thuẫn hoặc không nhất quán (incongruity) và sau đó được giải quyết bất ngờ ở phần \"câu kết\" (punch line)."}]}, {"n": 15, "q": "Tác động của âm nhạc đến hành vi con người là gì? Tác động của MV \"There's no one at all\" của Sơn Tùng đối với người nghe dựa trên lý thuyết cấy trồng truyền thông (Cultivation Theory) do George Gerbner đề xuất năm 1969 được thể hiện như thế nào?", "a": [{"l": 0, "b": true, "t": "Tác động của âm nhạc: Âm nhạc ảnh hưởng lớn đến tâm trạng (mood management), khơi gợi ký ức (memory cue), điều tiết cảm xúc và định hình hành vi của người nghe."}, {"l": 0, "b": true, "t": "Liên hệ với Lý thuyết Cấy trồng (Cultivation Theory): Lý thuyết này cho rằng việc tiếp xúc lặp đi lặp lại với các nội dung truyền thông (ví dụ: hình ảnh bạo lực, tiêu cực trong một sản phẩm âm nhạc) sẽ \"cấy trồng\" vào tâm trí người xem (đặc biệt là giới trẻ) một thế giới quan lệch lạc, khiến họ xem bạo lực hoặc sự bi lụy là điều bình thường hoặc chấp nhận được trong cuộc sống."}]}, {"n": 16, "q": "Tại sao con người tìm kiếm các nội dung thể thao trên truyền thông, và bản chất tâm lý của trải nghiệm đó là gì?", "a": [{"l": 0, "b": true, "t": "Con người tìm đến thể thao vì tính chất trực tiếp, chưa kịch bản trước và kết quả còn bỏ ngỏ."}, {"l": 0, "b": true, "t": "Bản chất tâm lý: Mang động lực về cảm xúc (giải trí, kích thích sự hưng phấn, nâng cao lòng tự trọng, sự trốn chạy thực tại), nhận thức (học hỏi, thẩm mỹ) và xã hội (sự gắn kết nhóm, đồng cảm)."}]}, {"n": 17, "q": "Sự đồng cảm (empathy) nâng cao mức độ tận hưởng truyền thông của chúng ta như thế nào?", "a": [{"l": 0, "b": true, "t": "Sự đồng cảm cho phép chúng ta \"cảm nhận thay\" những gì nhân vật đang trải qua (sự đồng hóa cảm xúc). Điều này làm tăng sự gắn kết với cốt truyện: ta thấy vui hơn khi nhân vật hài hước thành công, hoặc cảm thấy hồi hộp, thắt ruột khi đội bóng yêu quý của ta đang bị dẫn trước ở những phút cuối."}]}, {"n": 18, "q": "Bạn suy nghĩ như thế nào về nhận định: \"Truyền hình đã thay đổi thể thao theo vô số cách\"?", "a": [{"l": 0, "b": true, "t": "Nhận định này hoàn toàn chính xác. Truyền hình đã biến thể thao từ các hoạt động thi đấu thuần túy thành một ngành công nghiệp giải trí lớn:"}, {"l": 0, "b": true, "t": "Thay đổi cấu trúc giải đấu (thời gian nghỉ giữa hiệp để chèn quảng cáo)."}, {"l": 0, "b": true, "t": "Làm tăng tính rực rỡ, nhiều màu sắc thị giác hơn (sân vận động, màn hình điểm số điện tử)."}, {"l": 0, "b": true, "t": "Biến Thế vận hội và các giải đấu lớn thành các sự kiện truyền thông toàn cầu trị giá hàng tỷ đô la."}]}, {"n": 19, "q": "Cách thể hiện phụ nữ trên truyền thông thực sự có thể gây hại như thế nào đối với những phụ nữ tiếp xúc với các hình tượng đó?", "a": [{"l": 0, "b": true, "t": "Việc truyền thông liên tục lặp lại các khuôn mẫu: phụ nữ phải cực kỳ gầy, trẻ mãi không già, hoặc gắn liền với vai trò nội trợ thụ động sẽ gây áp lực tâm lý lớn:"}, {"l": 0, "b": true, "t": "Dẫn đến các chứng rối loạn ăn uống (như trường hợp nghiên cứu ở đảo Fiji sau khi có TV)."}, {"l": 0, "b": true, "t": "Giảm tự tin về ngoại hình, tự ti về cơ thể (body image issues), và củng cố sự bất bình đẳng giới trong xã hội."}]}, {"n": 20, "q": "Tác động của định kiến giới trên truyền thông là gì? Cho ví dụ.", "a": [{"l": 0, "b": true, "t": "Tác động: Việc tiếp xúc nhiều với định kiến giới khiến người xem củng cố các hành vi áp đặt theo giới tính (sex-typed behavior), duy trì cái nhìn rập khuôn rằng nam giới phải lạnh lùng, mạnh mẽ, cơ bắp còn nữ giới phải yếu đuối, phục tùng hoặc chỉ lo việc gia đình."}, {"l": 0, "b": true, "t": "Ví dụ: Quảng cáo thường vẽ nên hình ảnh người chồng lóng ngóng, không biết thay tã cho con, trong khi người mẹ phải gánh vác toàn bộ việc nhà (\"Mom as Superwoman\" / \"Dad as Buffoon\")."}]}];
const $ = id => document.getElementById(id);
let deck = [], idx = 0, status = {};
try { status = JSON.parse(localStorage.getItem("mmp_status") || "{}"); } catch(e) {}
function save(){ try { localStorage.setItem("mmp_status", JSON.stringify(status)); } catch(e) {} }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

/* ---------- mascots ---------- */
const face = (y=56, o={}) => `
  <ellipse class="blink" cx="37" cy="${y}" rx="4" ry="5.5" fill="${o.eye||'#33465f'}"/><ellipse class="blink" cx="63" cy="${y}" rx="4" ry="5.5" fill="${o.eye||'#33465f'}"/>
  <circle cx="38.6" cy="${y-2.6}" r="1.6" fill="#fff"/><circle cx="64.6" cy="${y-2.6}" r="1.6" fill="#fff"/>
  <ellipse cx="26" cy="${y+9}" rx="6.5" ry="4.2" fill="#ff9db9" opacity=".75"/><ellipse cx="74" cy="${y+9}" rx="6.5" ry="4.2" fill="#ff9db9" opacity=".75"/>
  ${o.nomouth?'':`<path d="M45 ${y+8}q5 6 10 0" fill="none" stroke="#33465f" stroke-width="2.6" stroke-linecap="round"/>`}`;
const W = (inner) => `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="50" cy="94" rx="30" ry="4" fill="#5aa9e6" opacity=".18"/>${inner}</svg>`;
const MASCOTS = [
 /* mèo */ () => W(`<path d="M18 46L20 12 44 30Z" fill="#ffe9d6" stroke="#f0b88a" stroke-width="3" stroke-linejoin="round"/><path d="M82 46L80 12 56 30Z" fill="#ffe9d6" stroke="#f0b88a" stroke-width="3" stroke-linejoin="round"/><path d="M24 36l1-14 11 9z" fill="#ffb3c8"/><path d="M76 36l-1-14-11 9z" fill="#ffb3c8"/>
   <ellipse cx="50" cy="60" rx="38" ry="31" fill="#fff3e6" stroke="#f0b88a" stroke-width="3"/>${face(58)}<path d="M47 63h6l-3 3.5z" fill="#ff9db9"/>
   <path d="M14 58l12 2M14 66l12-3M86 58l-12 2M86 66l-12-3" stroke="#f0b88a" stroke-width="2" stroke-linecap="round"/>`),
 /* thỏ */ () => W(`<ellipse cx="34" cy="26" rx="10" ry="25" fill="#fff" stroke="#e7c8d8" stroke-width="3"/><ellipse cx="66" cy="26" rx="10" ry="25" fill="#fff" stroke="#e7c8d8" stroke-width="3"/><ellipse cx="34" cy="28" rx="4.5" ry="17" fill="#ffc2d6"/><ellipse cx="66" cy="28" rx="4.5" ry="17" fill="#ffc2d6"/>
   <ellipse cx="50" cy="64" rx="36" ry="29" fill="#fff" stroke="#e7c8d8" stroke-width="3"/>${face(62)}<path d="M47 67h6l-3 3.5z" fill="#ff9db9"/>`),
 /* gấu */ () => W(`<circle cx="22" cy="32" r="12" fill="#f3d3b0" stroke="#d9a974" stroke-width="3"/><circle cx="78" cy="32" r="12" fill="#f3d3b0" stroke="#d9a974" stroke-width="3"/><circle cx="22" cy="32" r="5.5" fill="#ffc9a8"/><circle cx="78" cy="32" r="5.5" fill="#ffc9a8"/>
   <ellipse cx="50" cy="60" rx="37" ry="32" fill="#f9e1c4" stroke="#d9a974" stroke-width="3"/><ellipse cx="50" cy="70" rx="14" ry="10" fill="#fff4e4"/>${face(55)}<ellipse cx="50" cy="64.5" rx="4" ry="3" fill="#6b4a36"/>`),
 /* gà con */ () => W(`<path d="M44 26q-4-12 4-16M52 26q2-12 10-12" fill="none" stroke="#f4cf4f" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="60" r="36" fill="#fff0a6" stroke="#f4cf4f" stroke-width="3"/>${face(55,{nomouth:true})}<path d="M44 63h12l-6 9z" fill="#ffa94d" stroke="#f08a2a" stroke-width="2" stroke-linejoin="round"/>
   <path d="M12 66q-8-6-2-14M88 66q8-6 2-14" fill="none" stroke="#f4cf4f" stroke-width="5" stroke-linecap="round"/>`),
 /* gấu trúc */ () => W(`<circle cx="20" cy="30" r="12" fill="#444b5c"/><circle cx="80" cy="30" r="12" fill="#444b5c"/>
   <ellipse cx="50" cy="60" rx="38" ry="32" fill="#fff" stroke="#c9d6e6" stroke-width="3"/><ellipse cx="37" cy="56" rx="9" ry="11" fill="#444b5c" transform="rotate(20 37 56)"/><ellipse cx="63" cy="56" rx="9" ry="11" fill="#444b5c" transform="rotate(-20 63 56)"/>
   ${face(56,{eye:'#fff'})}<ellipse cx="50" cy="66" rx="4" ry="3" fill="#444b5c"/>`),
 /* nhím */ () => W(`<path d="M8 72L5 54l11 4-3-18 12 8-1-19 13 11 3-19 10 15 8-18 5 19 12-12-1 19 12-8-4 18 10-2-5 19z" fill="#a9c1f0" stroke="#7592d6" stroke-width="3" stroke-linejoin="round"/>
   <circle cx="26" cy="58" r="7" fill="#ffe7d1" stroke="#e3b48f" stroke-width="2.5"/><circle cx="74" cy="58" r="7" fill="#ffe7d1" stroke="#e3b48f" stroke-width="2.5"/>
   <ellipse cx="50" cy="69" rx="32" ry="24" fill="#ffe7d1" stroke="#e3b48f" stroke-width="3"/><ellipse cx="50" cy="76" rx="13" ry="9" fill="#fff4e8"/>${face(63)}<ellipse cx="50" cy="71" rx="3.6" ry="2.8" fill="#5a4a5e"/>`),
 /* mây */ () => W(`<path d="M24 80c-13 0-20-8-20-18 0-10 8-17 18-18 2-14 14-24 28-24 15 0 26 9 29 22 11 1 19 9 19 19 0 11-9 19-21 19z" fill="#eaf6ff" stroke="#8cc7f2" stroke-width="3" stroke-linejoin="round"/>${face(58)}`),
 /* dâu tây */ () => W(`<path d="M50 12q-10 4-14 10 8-2 14 2 6-4 14-2-4-6-14-10z" fill="#7fd88f" stroke="#4fb868" stroke-width="2.5" stroke-linejoin="round"/><path d="M50 22C20 20 10 46 18 66c8 18 24 24 32 24s24-6 32-24c8-20-2-46-32-44z" fill="#ff8aa6" stroke="#e8587f" stroke-width="3"/>
   ${face(54)}<g fill="#ffe3ea" opacity=".9"><circle cx="30" cy="38" r="1.6"/><circle cx="70" cy="38" r="1.6"/><circle cx="24" cy="54" r="1.6"/><circle cx="76" cy="54" r="1.6"/><circle cx="40" cy="78" r="1.6"/><circle cx="60" cy="78" r="1.6"/><circle cx="50" cy="40" r="1.6"/></g>`)
];
const PALETTE = [["#5aa9e6","#2f7fc0"],["#7ea3f2","#4a6fd0"],["#4fbfd8","#16809a"],["#6fc3ea","#2a86b8"],["#58c7bd","#1c7d75"],["#92a9f5","#5b72d4"]];
const CHEERS = ["Nhớ chưa nè? 🤔","Cố lên bạn ơi! 💪","Đoán thử xem~ 🌟","Hít thở, nghĩ nào! ☁️","Bạn làm được mà! 💖","Gợi ý: nhớ từ khóa! 🔑","Thử nói to lên xem! 🗣️","Ngầu quá đi~ ✨"];

function build(list){ deck = shuffle(list); idx = 0; $("done").style.display="none"; render(); }
function render(){
  const c = deck[idx], card = $("card");
  card.classList.add("nt"); card.classList.remove("flip"); card.classList.remove("spin"); void card.offsetWidth; card.classList.remove("nt");
  const sc = $("scene"); sc.classList.remove("pop"); void sc.offsetWidth; sc.classList.add("pop");
  if(!c){ showDone(); return; }
  const pi = (c.n*7 + idx) % PALETTE.length;
  document.documentElement.style.setProperty("--c", PALETTE[pi][0]);
  document.documentElement.style.setProperty("--cd", PALETTE[pi][1]);
  const m = MASCOTS[Math.floor(Math.random()*MASCOTS.length)];
  $("mascot").innerHTML = m(); $("mini").innerHTML = m();
  $("bubble").textContent = CHEERS[Math.floor(Math.random()*CHEERS.length)];
  $("fnum").textContent = $("bnum").textContent = "Câu " + c.n;
  const q = $("q"); q.textContent = c.q;
  q.className = "qtxt" + (c.q.length > 200 ? " xs" : c.q.length > 120 ? " s" : "");
  $("a").innerHTML = '<div class="miniq">' + esc(c.q) + '</div>' + c.a.map(it => '<div class="it' + (it.b?' b':'') + ' l' + Math.min(it.l,4) + '">' + esc(it.t) + '</div>').join("");
  $("a").scrollTop = 0;
  fit();
  updateStats();
}
function fit(){
  const a = $("a"), base = window.innerWidth < 560 ? 15.5 : 17.5;
  let fs = base;
  do { a.style.setProperty("--fs", fs+"px"); a.style.setProperty("--lh", (fs*1.95)+"px"); fs -= .5; }
  while(a.scrollHeight > a.clientHeight + 1 && fs >= 13);
}
window.addEventListener("resize", () => { if(deck[idx]) fit(); });
function updateStats(){
  const k = CARDS.filter(c => status[c.n]==="k").length, u = CARDS.filter(c => status[c.n]==="u").length;
  $("kn").textContent = k; $("un").textContent = u;
  $("pos").textContent = deck.length ? Math.min(idx+1, deck.length) : 0; $("tot").textContent = deck.length;
  $("bk").style.width = (k/CARDS.length*100) + "%"; $("bu").style.width = (u/CARDS.length*100) + "%";
}
function confetti(){
  const em = ["🎉","⭐","💙","✨","🫧","🐋","💎","🩵","🦋"];
  for(let i=0;i<34;i++){ const e=document.createElement("div"); e.className="fall"; e.textContent=em[i%em.length];
    e.style.left=Math.random()*100+"vw"; e.style.animationDuration=(2.5+Math.random()*2.5)+"s"; e.style.animationDelay=(Math.random()*.8)+"s";
    document.body.appendChild(e); setTimeout(()=>e.remove(),6500); }
}
function burst(btn, emoji){
  const r = btn.getBoundingClientRect();
  for(let i=0;i<7;i++){ const e=document.createElement("div"); e.className="rise"; e.textContent=emoji[i%emoji.length];
    e.style.left=(r.left + r.width/2 + (Math.random()-.5)*r.width*.6)+"px"; e.style.top=(r.top)+"px";
    e.style.setProperty("--dx",((Math.random()-.5)*110)+"px"); e.style.setProperty("--r",((Math.random()-.5)*60)+"deg");
    e.style.animationDelay=(i*0.05)+"s"; document.body.appendChild(e); setTimeout(()=>e.remove(),1500); }
}
function showDone(){
  const k = CARDS.filter(c => status[c.n]==="k").length, u = CARDS.filter(c => status[c.n]==="u").length;
  $("sum").textContent = "Đã thuộc " + k + " · Chưa thuộc " + u + " · Chưa đánh dấu " + (CARDS.length-k-u);
  $("done").style.display = "flex"; updateStats(); confetti();
}
function go(d){ if(!deck.length) return; if(idx+d >= deck.length){ idx = deck.length; showDone(); return; } idx = Math.max(0, idx+d); $("done").style.display="none"; render(); }
function mark(s){ const c = deck[idx]; if(!c) return; status[c.n] = s; save(); burst($(s==="k"?"bknow":"bdont"), s==="k" ? ["💖","✨","⭐"] : ["💭","💪","🌱"]); go(1); }
function flipCard(){ const c=$("card"); c.classList.toggle("flip"); c.classList.remove("spin"); void c.offsetWidth; c.classList.add("spin"); }
$("card").onclick = flipCard;
$("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
$("bknow").onclick = () => mark("k"); $("bdont").onclick = () => mark("u");
$("shuf").onclick = () => build(deck.length ? deck : CARDS);
$("all").onclick = () => build(CARDS);
$("only").onclick = $("redo").onclick = () => { const l = CARDS.filter(c => status[c.n]==="u"); if(!l.length){ alert("Chưa có thẻ nào được đánh dấu 'Chưa thuộc'."); return; } build(l); };
$("again").onclick = () => build(CARDS);
$("rst").onclick = () => { if(confirm("Xóa toàn bộ tiến độ đã thuộc / chưa thuộc?")){ status = {}; save(); build(CARDS); } };
document.addEventListener("keydown", e => {
  if(e.code==="Space"||e.code==="Enter"){ e.preventDefault(); flipCard(); }
  else if(e.code==="ArrowRight") go(1); else if(e.code==="ArrowLeft") go(-1);
  else if(e.key==="k"||e.key==="K") mark("k"); else if(e.key==="d"||e.key==="D") mark("u");
  else if(e.key==="s"||e.key==="S") build(deck.length?deck:CARDS);
});
build(CARDS);
</script>

<script>
(function(){
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone) return;
  var btn = document.getElementById('pwaBtn'), tip = document.getElementById('pwaTip'), dp = null;
  try { if (localStorage.getItem('pwa_dismiss')) return; } catch(e) {}
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); dp = e; btn.style.display='flex'; });
  if (ios) btn.style.display='flex';
  btn.addEventListener('click', function(ev){
    if (ev.target.className==='x'){ btn.style.display='none'; tip.style.display='none'; try{localStorage.setItem('pwa_dismiss','1');}catch(e){} return; }
    if (dp){ dp.prompt(); dp = null; btn.style.display='none'; return; }
    tip.innerHTML = ios ? 'Bấm nút <b>Chia sẻ</b> ⎋ ở thanh Safari → chọn <b>Thêm vào MH chính</b> (Add to Home Screen).'
                        : 'Mở menu ⋮ của trình duyệt → chọn <b>Thêm vào màn hình chính</b> / <b>Cài đặt ứng dụng</b>.';
    tip.style.display = tip.style.display==='block' ? 'none' : 'block';
  });
  window.addEventListener('appinstalled', function(){ btn.style.display='none'; tip.style.display='none'; });
})();
</script>
