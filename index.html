<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcard ôn tập – Truyền thông đại chúng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#f1faff;--bg2:#e9f4ff;--bg3:#f4f9ff;
  --surface:#ffffff;--surface2:#f1f8ff;--text:#33465f;--muted:#7a8ea8;--line:#cfe6f7;
  --c:#5aa9e6;--cd:#2f7fc0;
  --mint:#7fd8be;--mint-d:#1f5b4a;--pink:#ffa6c1;--pink-d:#7a2448;--blue:#5aa9e6;--blue-d:#3b8fd4;
  --shadow:0 18px 40px rgba(90,150,210,.28);
  --head:"Fredoka","Nunito","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Nunito","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);
  background:
   radial-gradient(circle,rgba(110,175,240,.16) 2.5px,transparent 3px) 0 0/34px 34px,
   linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-attachment:fixed;
  display:flex;flex-direction:column;align-items:center;padding:12px 16px 10px;gap:10px;overflow:hidden;height:100vh;height:100dvh}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco span{position:absolute;opacity:.6;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-24px) rotate(8deg)}}
.deco span:nth-child(1){left:4%;top:10%;font-size:40px}
.deco span:nth-child(2){right:5%;top:16%;font-size:34px;animation-delay:-2s}
.deco span:nth-child(3){left:7%;bottom:16%;font-size:32px;animation-delay:-4s}
.deco span:nth-child(4){right:6%;bottom:9%;font-size:44px;animation-delay:-6s}
.deco span:nth-child(5){left:46%;top:3%;font-size:24px;animation-delay:-3s}
.deco span:nth-child(6){left:2%;top:50%;font-size:28px;animation-delay:-5s}
.deco span:nth-child(7){right:3%;top:52%;font-size:30px;animation-delay:-1s}
.deco span:nth-child(8){left:30%;bottom:3%;font-size:26px;animation-delay:-7s}
header,.bar,.scene,.ctrl,.kb{position:relative;z-index:1}
header{flex:none;width:100%;max-width:800px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:3px dashed var(--c);border-radius:999px;padding:6px 18px;box-shadow:0 6px 16px rgba(90,150,210,.15);transition:border-color .4s}
h1{font-family:var(--head);font-size:1.1rem;margin:0;font-weight:600;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
h1 .em{display:inline-block;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg) scale(1.15)}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.84rem;font-weight:800;padding:5px 13px;border-radius:999px;background:var(--surface2);border:2px solid var(--line)}
.chip.k{background:var(--mint);color:var(--mint-d);border-color:transparent}
.chip.u{background:var(--pink);color:var(--pink-d);border-color:transparent}
.bar{flex:none;width:100%;max-width:800px;height:16px;background:var(--surface);border:3px solid var(--line);border-radius:999px;display:flex;box-shadow:inset 0 3px 6px rgba(90,150,210,.15);position:relative;overflow:visible}
.bar .track{position:absolute;inset:0;border-radius:999px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .6s cubic-bezier(.3,.8,.3,1)}
.bar .k{background:repeating-linear-gradient(45deg,var(--mint),var(--mint) 10px,#a4ecd7 10px,#a4ecd7 20px)}
.bar .u{background:repeating-linear-gradient(45deg,var(--pink),var(--pink) 10px,#ffc7d9 10px,#ffc7d9 20px)}
.bar .star{position:absolute;right:-10px;top:-12px;font-size:24px;animation:wob 3s ease-in-out infinite}
.scene{width:100%;max-width:800px;flex:1 1 0;min-height:0;perspective:1800px;margin-top:4px}
.scene.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:translateY(22px) scale(.92) rotate(-1.5deg);opacity:.2}100%{transform:none;opacity:1}}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.9,.2,1.1);cursor:pointer}
.card.nt{transition:none}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:38px;padding:30px 34px;display:flex;flex-direction:column;overflow:hidden;
  border:4px solid var(--c);outline:7px solid var(--surface);box-shadow:var(--shadow),0 0 0 7px var(--surface)}
.face{margin:7px;inset:7px;}
.front{padding-bottom:104px;background:
   radial-gradient(circle,color-mix(in srgb,var(--c) 26%,transparent) 3.5px,transparent 4px) 0 0/26px 26px,
   color-mix(in srgb,var(--c) 9%,var(--surface))}
.back{transform:rotateY(180deg);background:var(--surface)}
.tape{position:absolute;left:50%;top:-12px;width:130px;height:34px;transform:translateX(-50%) rotate(-3deg);z-index:3;border-radius:6px;
  background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--c) 70%,#fff) 0 10px,color-mix(in srgb,var(--c) 40%,#fff) 10px 20px);opacity:.85;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.spark{position:absolute;font-size:22px;animation:tw 2.6s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{transform:scale(.7) rotate(0);opacity:.5}50%{transform:scale(1.2) rotate(20deg);opacity:1}}
.tag{display:inline-flex;align-self:flex-start;gap:10px;align-items:center;font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 16px;border-radius:999px;margin-bottom:14px;margin-top:6px;
  background:var(--c);color:#fff;text-shadow:0 1px 0 var(--cd);position:relative;z-index:2}
.tag b{background:#fff;color:var(--cd);text-shadow:none;border-radius:999px;padding:1px 9px}
.qtxt{margin:auto 0;font-family:var(--head);font-weight:500;font-size:1.7rem;line-height:1.55;position:relative;z-index:2;overflow-y:auto;max-height:68%;padding:4px 4px}
.qtxt.s{font-size:1.4rem}.qtxt.xs{font-size:1.2rem}
.hint{font-size:.88rem;color:var(--muted);font-weight:800;position:absolute;left:34px;bottom:26px;z-index:2;max-width:calc(100% - 340px)}
.mascot{position:absolute;right:22px;bottom:14px;width:78px;z-index:2;animation:bob 3.2s ease-in-out infinite}
.mascot svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 6px rgba(60,100,150,.18))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
.bubble{position:absolute;right:112px;bottom:46px;z-index:3;background:#fff;color:#33465f;font-weight:800;font-size:.8rem;padding:6px 12px;border-radius:16px;border:3px solid var(--c);max-width:170px;text-align:center;animation:bob 3.2s ease-in-out infinite;animation-delay:-1s}
.bubble::after{content:"";position:absolute;right:-9px;top:50%;margin-top:-7px;width:12px;height:12px;background:#fff;border-right:3px solid var(--c);border-top:3px solid var(--c);transform:rotate(45deg)}
.mini{position:absolute;right:20px;top:16px;width:56px;z-index:2;animation:bob 3s ease-in-out infinite}
.mini svg{width:100%;height:auto;display:block}
.blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ans{--fs:17px;--lh:34px;overflow-y:auto;flex:1;min-height:0;padding:2px 8px 4px 0;font-size:var(--fs);line-height:var(--lh);font-weight:700;position:relative;z-index:2;background:repeating-linear-gradient(transparent 0 calc(var(--lh) - 2px),color-mix(in srgb,var(--c) 22%,transparent) calc(var(--lh) - 2px) var(--lh)) local}
.ans::-webkit-scrollbar{width:9px}.ans::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--c) 45%,transparent);border-radius:9px}
.miniq{font-family:var(--head);font-weight:500;font-size:calc(var(--fs) * .92);line-height:1.4;color:var(--cd);background:color-mix(in srgb,var(--c) 14%,var(--surface));border:2px dashed var(--c);border-radius:18px;padding:9px 14px;margin:0 66px calc(var(--lh) - 28px) 0}
.it{position:relative;margin:0;padding-top:0}
.it.b{padding-left:1.5em}
.it.b::before{content:"♥";position:absolute;left:.15em;top:0;font-size:.8em;color:var(--c)}
.l1{margin-left:1.2em}.l2{margin-left:2.4em}.l3{margin-left:3.6em}.l4{margin-left:4.8em}
.l1.b::before{color:var(--mint)}.l2.b::before,.l3.b::before{color:var(--pink)}
.ctrl{flex:none;width:100%;max-width:800px;display:flex;flex-wrap:nowrap;gap:10px;justify-content:center}
.ctrl.sec button{font-size:.8rem;padding:6px 14px;border-width:2px;box-shadow:0 3px 0 var(--line)}
.ctrl.sec button:hover{box-shadow:0 5px 0 var(--line)}
button{font-family:inherit;font-weight:800;font-size:.95rem;padding:9px 20px;white-space:nowrap;border-radius:999px;border:3px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;
  box-shadow:0 5px 0 var(--line);transition:transform .12s,box-shadow .12s;position:relative}
button:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:0 8px 0 var(--line)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
button.know{background:var(--mint);color:var(--mint-d);border-color:transparent;box-shadow:0 5px 0 #5fb99e}
button.dont{background:var(--pink);color:var(--pink-d);border-color:transparent;box-shadow:0 5px 0 #e888a6}
button.pri{background:var(--blue);color:#fff;border-color:transparent;box-shadow:0 5px 0 var(--blue-d)}
button.know:hover{box-shadow:0 8px 0 #5fb99e}button.dont:hover{box-shadow:0 8px 0 #e888a6}button.pri:hover{box-shadow:0 8px 0 var(--blue-d)}
button.know:active,button.dont:active,button.pri:active{box-shadow:0 1px 0 rgba(0,0,0,.2)}
.kb{flex:none;font-size:.72rem;color:var(--muted);font-weight:700;text-align:center}
.done{display:none;position:absolute;inset:7px;background:var(--surface);border:4px dashed var(--c);border-radius:38px;box-shadow:var(--shadow);flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;z-index:5}
.done h2{margin:0;font-family:var(--head);font-weight:600;font-size:1.7rem}
.done .big{font-size:4.2rem;animation:bob 2s ease-in-out infinite}
.sum{color:var(--muted);font-weight:800}
.fall,.rise{position:fixed;z-index:50;pointer-events:none}
.fall{top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
.rise{font-size:24px;animation:rise 1.1s ease-out forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),-130px) scale(1.3) rotate(var(--r));opacity:0}}
@media (max-width:560px){
  body{padding:8px 8px 8px;gap:7px}.ctrl{gap:6px}.ctrl button{font-size:.78rem;padding:8px 9px}.ctrl.sec{gap:4px}.ctrl.sec button{font-size:.66rem;padding:5px 6px;flex:0 1 auto}.kb{display:none}
  header{padding:5px 12px}.chip{font-size:.74rem;padding:3px 8px}h1 .em:last-child{display:none}
  .face{padding:22px 20px}.qtxt{font-size:1.35rem}.qtxt.s{font-size:1.15rem}.qtxt.xs{font-size:1.02rem}
  .front{padding-bottom:84px}.mascot{width:60px;right:16px;bottom:12px}.bubble{display:none}.hint{max-width:calc(100% - 110px);font-size:.8rem;left:20px;bottom:22px}
  .mini{width:44px}.miniq{margin-right:52px;font-size:.92rem}
  h1{font-size:.84rem}
}
</style>
</head>
<body>
<div class="deco"><span>☁️</span><span>⭐</span><span>🫧</span><span>🐋</span><span>✨</span><span>💙</span><span>🌊</span><span>🦋</span></div>
<header>
  <h1><span class="em">🎀</span>Flashcard – Truyền thông đại chúng<span class="em">✨</span></h1>
  <div class="chips"><span class="chip">🃏 <b id="pos">0</b>/<b id="tot">0</b></span><span class="chip k">✅ <b id="kn">0</b></span><span class="chip u">💭 <b id="un">0</b></span></div>
</header>
<div class="bar"><div class="track"><i class="k" id="bk"></i><i class="u" id="bu"></i></div><span class="star">⭐</span></div>

<div class="scene" id="scene">
  <div class="card" id="card">
    <div class="face front">
      <div class="tape"></div>
      <span class="spark" style="left:18px;bottom:70px">✨</span><span class="spark" style="right:150px;top:22px;animation-delay:-1s">⭐</span><span class="spark" style="left:46%;bottom:22px;animation-delay:-2s;font-size:16px">💖</span>
      <div class="tag"><b id="fnum"></b><span>Câu hỏi</span></div>
      <div class="qtxt" id="q"></div>
      <div class="hint">🦔 Chạm vào thẻ hoặc nhấn Space để lật</div>
      <div class="bubble" id="bubble">Nhớ chưa nè? 🤔</div>
      <div class="mascot" id="mascot"></div>
    </div>
    <div class="face back">
      <div class="tape"></div>
      <div class="tag"><b id="bnum"></b><span>Đáp án</span></div>
      <div class="mini" id="mini"></div>
      <div class="ans" id="a"></div>
    </div>
  </div>
  <div class="done" id="done"><div class="big">🎉</div><h2>Giỏi quá, xong một vòng rồi! 🌈</h2><div id="sum" class="sum"></div><div class="ctrl"><button class="pri" id="again">🔀 Học lại (xáo trộn)</button><button id="redo">💭 Ôn thẻ chưa thuộc</button></div></div>
</div>

<div class="ctrl">
  <button id="prev">← Trước</button>
  <button class="dont" id="bdont">💭 Chưa thuộc</button>
  <button class="know" id="bknow">✅ Đã thuộc</button>
  <button id="next">Sau →</button>
</div>
<div class="ctrl sec">
  <button class="pri" id="shuf">🔀 Xáo trộn</button>
  <button id="only">💭 Thẻ chưa thuộc</button>
  <button id="all">🃏 Tất cả 42 thẻ</button>
  <button id="rst">🧹 Đặt lại</button>
</div>
<div class="kb">Phím tắt: Space/Enter = lật · ← → = chuyển thẻ · K = đã thuộc · D = chưa thuộc · S = xáo trộn</div>

<script>
const CARDS = [{"n": 1, "q": "Có bao nhiêu loại hình truyền thông đại chúng? So sánh hình thức và nội dung của một chương trình qua các phương tiện khác nhau.", "a": [{"l": 0, "b": true, "t": "Phân loại (3 nhóm chính): Gồm 2 nhóm truyền thống là Truyền thông in ấn (Print media) như báo chí, tạp chí (đòi hỏi khả năng đọc hiểu - literacy) và Truyền thông điện tử/phát sóng (Electronic/Broadcast media) như radio, truyền hình, cáp/video (ít phụ thuộc vào trình độ đọc viết), cùng 1 nhóm mới là Truyền thông qua máy tính/Internet (Computer-Mediated Communication - CMC) cho phép bất kỳ ai cũng có thể tự đăng tải và tương tác."}, {"l": 0, "b": true, "t": "Ví dụ so sánh (Chương trình Thời sự 19h của VTV):"}, {"l": 1, "b": true, "t": "Truyền hình (TV): Kết hợp hình ảnh chuyển động và âm thanh (visual + audio), phát sóng cố định vào khung giờ vàng (prime time), truyền tải trực quan hiện trường và cảm xúc nhân vật tới lượng khán giả đại chúng lớn."}, {"l": 1, "b": true, "t": "Phát thanh (Radio - VOV/VTV Audio): Chỉ sử dụng âm thanh (giọng đọc phát thanh viên, tiếng động hiện trường), cho phép thính giả tiếp nhận tin tức song song với hoạt động khác như lái xe."}, {"l": 1, "b": true, "t": "Báo in (Print): Trình bày bằng văn bản tĩnh và ảnh chụp chọn lọc, đi sâu vào số liệu phân tích và bình luận chuyên sâu, đòi hỏi nỗ lực tư duy đọc hiểu cao hơn nhưng người đọc chủ động về tốc độ tiếp nhận."}, {"l": 1, "b": true, "t": "Internet / Mạng xã hội (VTV Go, Facebook, YouTube, Báo điện tử): Đa phương tiện (multimedia), tích hợp siêu liên kết (hypertext), cắt thành các clip ngắn theo từng tin, cho phép xem lại không đồng bộ (asynchronous) và bình luận, chia sẻ trực tiếp."}]}, {"n": 2, "q": "Điều gì làm cho Truyền thông Đại chúng mang tính \"Đại chúng\" (What makes Mass Communication \"Mass\")?", "a": [{"l": 0, "b": true, "t": "Công chúng đông đảo, ẩn danh và không đồng nhất (Large, anonymous, and heterogeneous audience): Người phát thông điệp không biết trực tiếp từng người nhận; khán giả đa dạng về độ tuổi, văn hóa và trải nghiệm cá nhân nên cùng một thông điệp sẽ mang ý nghĩa khác nhau với từng người."}, {"l": 0, "b": true, "t": "Bản chất định chế và có tổ chức (Institutional and organizational): Quá trình sản xuất, biên tập và phân phối nội dung được vận hành bởi các tổ chức truyền thông chuyên nghiệp với hệ thống kinh tế - kỹ thuật phức tạp."}, {"l": 0, "b": true, "t": "Chức năng kinh tế gắn liền với quảng cáo (Basic economic function): Mục tiêu kinh tế cốt lõi của hầu hết các phương tiện truyền thông thương mại là thu hút và giữ chân lượng khán giả lớn nhất có thể để bán quảng cáo (for advertisers), yếu tố này đôi khi chi phối ngược lại việc lựa chọn nội dung đăng tải."}]}, {"n": 3, "q": "So sánh tần suất sử dụng các phương tiện truyền thông đại chúng khác nhau theo độ tuổi.", "a": [{"l": 0, "b": true, "t": "Truyền hình (Television):"}, {"l": 1, "b": true, "t": "2 – 4 tuổi: Thời lượng xem tăng nhanh từ khoảng 15 phút lên tới 2,5 giờ/ngày."}, {"l": 1, "b": true, "t": "4 – 8 tuổi: Xem ít hơn giai đoạn trước 4 tuổi do trẻ bắt đầu đi học và có thêm hoạt động vui chơi."}, {"l": 1, "b": true, "t": "Học sinh trung học, sinh viên và người trẻ trưởng thành (Young adulthood): Xem TV ít hơn các nhóm tuổi khác do bận rộn với việc học tập, đi làm, hẹn hò, nghe nhạc và chăm sóc con nhỏ."}, {"l": 1, "b": true, "t": "Người cao tuổi (Elderly adults): Là nhóm dành nhiều thời gian xem truyền hình nhất."}, {"l": 0, "b": true, "t": "Phát thanh (Radio): Phân khúc rất mạnh theo độ tuổi (highly age-segmented) thông qua định dạng nội dung (người trẻ nghe các kênh âm nhạc Pop/Rock; người trưởng thành và trung niên nghe tin tức, talkshow khi di chuyển)."}, {"l": 0, "b": true, "t": "Báo in và Tạp chí (Print): Tỷ lệ đọc báo in tập trung ở người trưởng thành và lớn tuổi (giảm mạnh ở giới trẻ), trong khi tạp chí phân hóa theo từng nhóm tuổi và sở thích chuyên biệt (niche audience)."}, {"l": 0, "b": true, "t": "Internet / CMC: Thanh thiếu niên và người trẻ tuổi có tần suất sử dụng và đa nhiệm (multitasking) cao nhất, dù tỷ lệ tiếp cận ở người lớn tuổi đang ngày càng tăng."}]}, {"n": 4, "q": "Những đặc tính nào của Internet khiến nó phù hợp hoàn hảo cho truyền thông đại chúng?", "a": [{"l": 1, "b": true, "t": "Đa phương tiện (Multimedia): Tích hợp đồng thời văn bản, hình ảnh, âm thanh và video trên cùng một nền tảng, hội tụ ưu thế của cả báo in, radio và truyền hình."}, {"l": 0, "b": false, "t": "Tính tương tác và đồng sáng tạo (Interactivity & User-generated content): Xóa bỏ ranh giới một chiều truyền thống, cho phép người dùng vừa tiêu thụ (consume), vừa tự sản xuất (produce) và chia sẻ (share) nội dung ở quy mô rộng."}, {"l": 1, "b": true, "t": "Siêu văn bản (Hypertextuality): Cho phép người dùng điều hướng thông tin phi tuyến tính qua các đường dẫn (links) để tra cứu sâu theo nhu cầu cá nhân."}, {"l": 1, "b": true, "t": "Giao tiếp đồng bộ và không đồng bộ (Synchronous & Asynchronous): Hỗ trợ cả tương tác thời gian thực (livestream, trò chuyện trực tiếp) lẫn lưu trữ để truy cập bất kỳ lúc nào mà không phụ thuộc vào khung giờ phát sóng cố định."}]}, {"n": 5, "q": "Truyền thông được nghiên cứu khoa học theo mấy danh mục? Có bao nhiêu cách nhìn nhận truyền thông qua việc khảo sát?", "a": [{"l": 0, "b": true, "t": "2 danh mục nghiên cứu cơ bản (Two basic categories of research):"}, {"l": 0, "b": true, "t": "Nghiên cứu hành chính/thương mại (Administrative research): Do các đài truyền hình, nhà xuất bản hoặc công ty quảng cáo thực hiện vì mục đích thương mại (điển hình là đo lường tỷ suất người xem - Nielsen Ratings), thường không công bố trên các tạp chí học thuật bình duyệt."}, {"l": 0, "b": true, "t": "Nghiên cứu khoa học/phê phán độc lập (Scientific study / Critical research): Nghiên cứu độc lập nhằm lý giải bản chất tác động của truyền thông và vai trò của nó đối với xã hội cũng như tâm lý con người."}, {"l": 0, "b": true, "t": "3 cách khảo sát/nhìn nhận truyền thông (Three Media Research Frameworks):"}, {"l": 0, "b": true, "t": "Khảo sát Nội dung (Looking at Content - \"Media nói gì?\"): Dùng phương pháp phân tích nội dung (content analysis) để đếm tần suất xuất hiện của các nhóm nhân vật, bạo lực hoặc khuôn mẫu giới/sắc tộc; là tiền đề cho nghiên cứu tiếp xúc và tác động."}, {"l": 0, "b": true, "t": "Khảo sát Mức độ tiếp xúc (Looking at Exposure - \"Ai dùng gì, bao lâu, khi nào, vì sao?\"): Đo lường nhân khẩu học và thói quen sử dụng (cần lưu ý việc bật thiết bị/lướt web không đồng nghĩa với việc người dùng thực sự tập trung chú ý)."}, {"l": 0, "b": true, "t": "Khảo sát Tác động (Looking at Effects - \"Media tạo ra thay đổi gì?\"): Đánh giá ảnh hưởng của truyền thông dựa trên 3 mô hình lý giải: Tác động trực tiếp (Direct effects / \"Magic bullet\"), Tác động có điều kiện (Conditional effects - phụ thuộc đặc điểm cá nhân và bối cảnh), và Tác động tích lũy (Cumulative effects - hình thành qua tiếp xúc lặp đi lặp lại)."}]}, {"n": 6, "q": "Có bao nhiêu nhóm tác động có thể đo lường được của truyền thông? Cho ví dụ.", "a": [{"l": 0, "b": true, "t": "Tác động hành vi (Behavioral Effects): Khán giả thực hiện một hành động cụ thể sau khi quan sát trên truyền thông (ví dụ: trẻ bắt chước hành vi bạo lực trên phim, người tiêu dùng mua sản phẩm sau khi xem quảng cáo, cử tri đi bỏ phiếu)."}, {"l": 0, "b": true, "t": "Tác động thái độ (Attitudinal Effects): Thay đổi niềm tin nhận thức (intellectual component) và cảm xúc yêu/ghét (emotional component) đối với một vấn đề hay đối tượng (ví dụ: có thiện cảm với một ứng viên chính trị hoặc thương hiệu hơn đối thủ; nhóm này thường khó đo lường nhân quả trực tiếp nhất)."}, {"l": 0, "b": true, "t": "Tác động nhận thức (Cognitive Effects): Thay đổi quá trình xử lý, thấu hiểu và ghi nhớ thông tin (comprehending and remembering) (ví dụ: trẻ nhớ thông tin ngôn từ tốt hơn qua radio nhưng nhớ hình ảnh và hành động tốt hơn qua TV)."}, {"l": 0, "b": true, "t": "Tác động sinh lý (Physiological Effects): Những biến đổi vật lý trực tiếp của cơ thể khi tiếp xúc với truyền thông (ví dụ: tăng nhịp tim, thở gấp, đổ mồ hôi khi xem phim kinh dị hoặc một trận đấu thể thao kịch tính)."}]}, {"n": 7, "q": "Làm thế nào xác định mức độ ảnh hưởng của truyền thông? So sánh ảnh hưởng của cha mẹ, cộng đồng với truyền thông bạo lực đối với hành vi bạo lực của trẻ.", "a": [{"l": 0, "b": true, "t": "Cách xác định mức độ ảnh hưởng (Determining the strength of effects): Sử dụng kết hợp nghiên cứu thực nghiệm trong phòng thí nghiệm (lab experiments), nghiên cứu hiện trường (field studies), khảo sát tương quan và nghiên cứu dọc theo thời gian, đồng thời phải áp dụng nguyên tắc thận trọng nhân quả (Causal caution) (không đánh đồng \"có mối liên hệ tương quan\" với \"truyền thông trực tiếp gây ra\") và lưu ý Hiệu ứng người thứ ba (Third-person effect) (xu hướng tin rằng người khác dễ bị truyền thông thao túng hơn bản thân mình)."}, {"l": 0, "b": true, "t": "So sánh trong trường hợp hành vi bạo lực ở trẻ em:"}, {"l": 0, "b": true, "t": "Cha mẹ và cộng đồng có sức ảnh hưởng lớn hơn: Các yếu tố xã hội hóa trực tiếp (cách giáo dục của cha mẹ, bạo lực gia đình, bạn bè đồng trang lứa, môi trường sống) là nguyên nhân nền tảng và mạnh mẽ hơn nhiều so với truyền thông."}, {"l": 0, "b": true, "t": "Vai trò của truyền thông bạo lực: Truyền thông không tác động như \"viên đạn ma thuật\" đồng nhất lên mọi trẻ em mà hoạt động theo mô hình tác động có điều kiện (Conditional effects) và tích lũy (Cumulative effects). Trẻ sống trong gia đình thiếu sự định hướng truyền thông của cha mẹ (parental mediation) hoặc thường xuyên chứng kiến bạo lực ngoài đời thực sẽ dễ kích hoạt hành vi hung hãn khi xem nội dung bạo lực hơn trẻ có môi trường gia đình lành mạnh."}]}, {"n": 8, "q": "Có bao nhiêu lý thuyết cụ thể định hướng nghiên cứu truyền thông đại chúng? Cho ví dụ.", "a": [{"l": 0, "b": true, "t": "Lý thuyết Nhận thức Xã hội (Social Cognitive Theory - Bandura): Học hỏi qua quan sát hình mẫu (modeling) gồm 4 bước: Chú ý (Attention)  Ghi nhớ (Encoding/Retention)  Thực hiện hành vi (Enactment)  Động lực/Củng cố (Motivation/Reinforcement). Ví dụ: Trẻ thấy nhân vật dùng bạo lực được tung hô như anh hùng nên bắt chước theo."}, {"l": 0, "b": true, "t": "Lý thuyết Cấy trồng (Cultivation Theory - Gerbner): Tiếp xúc truyền thông lặp đi lặp lại trong thời gian dài khiến thế giới quan của người xem dần đồng nhất với thế giới trên truyền hình. Ví dụ: Người xem nhiều tin tức tội phạm và phim hình sự thường nghĩ xã hội thực tế nguy hiểm hơn nhiều so với số liệu thống kê thực (Mean World Syndrome)."}, {"l": 0, "b": true, "t": "Lý thuyết Sử dụng và Hài lòng (Uses and Gratifications Theory): Khán giả là chủ thể chủ động lựa chọn phương tiện để thỏa mãn nhu cầu tâm lý - xã hội cụ thể. Ví dụ: Khán giả chủ động bật phim hài để điều chỉnh tâm trạng (mood management) hoặc xem tin tức để có chủ đề trò chuyện với bạn bè."}, {"l": 0, "b": true, "t": "Lý thuyết Thiết lập Chương trình nghị sự (Agenda Setting Theory): Truyền thông không quyết định công chúng \"nghĩ gì\", nhưng định hướng công chúng \"nên nghĩ và bàn luận về vấn đề gì\" (what to think about) thông qua tần suất đưa tin. Ví dụ: Khi truyền thông liên tục đưa tin về an toàn thực phẩm trên trang nhất, công chúng sẽ xem đây là vấn đề ưu tiên hàng đầu."}, {"l": 0, "b": true, "t": "Lý thuyết Lược đồ / Kịch bản nhận thức (Schema / Script Theory): Khán giả dùng cấu trúc kiến thức sẵn có trong trí nhớ (schemas/scripts) để giải mã nhanh thông tin mới trên truyền thông. Ví dụ: Nhờ có sẵn kịch bản nhận thức về thể loại phim trinh thám, khán giả nhanh chóng hiểu mạch điều tra mà không cần phim giải thích từng thủ tục."}, {"l": 0, "b": true, "t": "Giới hạn Năng lực Xử lý truyền thông và não bộ (Limited Capacity Model - Lang): Năng lực nhận thức của con người tại một thời điểm là hữu hạn (gồm xử lý tự động và xử lý có kiểm soát). Ví dụ: Một bản tin truyền hình chèn quá nhiều chữ chạy, đồ họa nhấp nháy và âm thanh dồn dập sẽ gây quá tải nhận thức (cognitive load), khiến người xem không nhớ được thông tin chính."}]}, {"n": 9, "q": "Cách sử dụng truyền thông đặc thù ảnh hưởng như thế nào đến trẻ em (Children's distinctive use of media)?", "a": [{"l": 0, "b": true, "t": "Nỗ lực tư duy và Tương tác xã hội (Mental Effort and Social Interaction):"}, {"l": 0, "b": true, "t": "Xem truyền hình đòi hỏi ít nỗ lực tư duy (mental effort) hơn đọc báo/sách in; trẻ vẫn chủ động chọn lọc thông tin và ban đầu dành nhiều chú ý cho các phân đoạn khó, nhưng sẽ lập tức giảm chú ý nếu nội dung vượt quá tầm hiểu biết."}, {"l": 0, "b": true, "t": "Các nghiên cứu chỉ ra không có mối liên hệ tiêu cực trực tiếp giữa tổng thời gian xem TV với lượng thời gian trẻ dành cho các hoạt động giao tiếp liên cá nhân."}, {"l": 0, "b": true, "t": "Phương tiện truyền thông và Trí tưởng tượng (The Medium and Imagination):"}, {"l": 0, "b": true, "t": "Truyền hình có thể làm giảm điểm số sáng tạo của trẻ vì việc xem TV chiếm chỗ (displaces) quỹ thời gian dành cho các trò chơi vận dụng trí tưởng tượng tự do (creative play - như nghiên cứu thực địa tại thị trấn Notel, Canada)."}, {"l": 0, "b": true, "t": "Đặc tính trực quan hóa sẵn mọi hình ảnh (highly visual nature) của truyền hình có thể làm trẻ ít phải tự hình dung và xử lý ý tưởng sáng tạo hơn so với khi đọc sách hoặc nghe radio."}]}, {"n": 10, "q": "Thông tin được trích xuất từ truyền thông khác nhau như thế nào giữa trẻ em và người lớn? Cho ví dụ.", "a": [{"l": 0, "b": true, "t": "Khác biệt theo đặc trưng phương tiện (Verbal vs. Pictorial): Radio và báo in thiên về ngôn từ (verbal), còn truyền hình thiên về hình ảnh (pictorial); nghiên cứu cho thấy trẻ nhớ thông tin lời nói tốt hơn từ radio nhưng lại trích xuất và nhớ thông tin hình ảnh, hành động từ truyền hình vượt trội hơn."}, {"l": 0, "b": true, "t": "Khác biệt về chiều sâu nhận thức giữa Trẻ em và Người lớn:"}, {"l": 0, "b": true, "t": "Trẻ em: Bị chi phối mạnh bởi các yếu tố nổi bật về mặt giác quan (perceptual salience như màu sắc sặc sỡ, âm thanh lớn, chuyển động nhanh); thường trích xuất các chi tiết bề nổi, rời rạc, khó phân biệt thông tin cốt lõi với chi tiết phụ và khó suy luận động cơ tâm lý do thiếu các schemas/scripts trưởng thành."}, {"l": 0, "b": true, "t": "Người lớn: Dựa vào hệ thống schemas phong phú để lọc bỏ yếu tố gây nhiễu, trích xuất được mạch nhân quả của cốt truyện, động cơ ẩn sau hành động của nhân vật và thông điệp trừu tượng."}, {"l": 0, "b": true, "t": "Ví dụ minh họa: Khi cùng xem một bộ phim hoặc quảng cáo, trẻ nhỏ chỉ nhớ hình dáng bắt mắt của nhân vật hoạt hình, cảnh rượt đuổi vui nhộn hoặc giai điệu bài hát quảng cáo, trong khi người lớn nắm bắt được mâu thuẫn tâm lý giữa các nhân vật, bài học ẩn dụ của bộ phim hoặc mục đích thuyết phục thương mại của nhãn hàng."}]}, {"n": 11, "q": "Có bao nhiêu thành phần nhận thức tham gia vào trải nghiệm truyền thông của chúng ta?", "a": [{"l": 0, "b": true, "t": "Các thành phần nhận thức chính trong trải nghiệm truyền thông bao gồm: Sự chú ý (Attention), Sự gác lại sự hoài nghi (Suspending Disbelief), Sự thăng hoa/cuốn hút vào cốt truyện (Transportation), và Sự đồng hóa/nhận diện nhân vật (Identification)."}]}, {"n": 12, "q": "Mối quan hệ cận xã hội với truyền thông (parasocial relationship) là gì? Lấy ví dụ và chỉ ra ưu, nhược điểm?", "a": [{"l": 0, "b": true, "t": "Khái niệm: Là mối quan hệ một chiều mà khán giả ảo tưởng hoặc cảm thấy mình có sự gắn kết thân thiết, gắn bó tâm lý với một nhân vật truyền thông, người nổi tiếng hoặc phát thanh viên mà họ không có sự tương tác trực tiếp ngoài đời."}, {"l": 0, "b": true, "t": "Ví dụ: Cảm thấy rất thân thiết, quý mến một Youtuber hoặc diễn viên truyền hình xem hằng ngày."}, {"l": 0, "b": true, "t": "Ưu điểm: Mang lại sự đồng hành, giải trí, thỏa mãn nhu cầu tâm lý xã hội cho người xem."}, {"l": 0, "b": true, "t": "Nhược điểm: Có thể dẫn đến ảo tưởng quá mức, gây hụt hẫng nặng nề, hoặc trong các trường hợp cực đoan có thể biến tướng thành hành vi ám ảnh, đeo bám nguy hiểm (như một số vụ việc fan quá khích được đề cập trong sách)."}]}, {"n": 13, "q": "Tại sao chúng ta cho rằng truyền thông mang lại cho chúng ta trải nghiệm cảm xúc gián tiếp (vicarious emotional experience)? Cho ví dụ minh họa.", "a": [{"l": 0, "b": true, "t": "Vì khi xem các chương trình truyền thông (như phim kinh dị, phim hình sự), chúng ta có thể cảm nhận được nỗi sợ hãi, sự hồi hộp hay căm giận của nhân vật mà không phải chịu bất kỳ hiểm họa vật lý thực tế nào."}, {"l": 0, "b": true, "t": "Ví dụ: Xem phim The Silence of the Lambs, người xem cảm thấy hồi hộp, căng thẳng nhưng đang ngồi an toàn trên ghế sofa ở nhà chứ không bị sát nhân tấn công thật."}]}, {"n": 14, "q": "Sự hài hước được thể hiện như thế nào ở các quốc gia khác nhau và yếu tố cấu thành là gì?", "a": [{"l": 0, "b": true, "t": "Sự hài hước phụ thuộc nhiều vào bối cảnh văn hóa của từng quốc gia (khác biệt về ngôn ngữ, chuẩn mực xã hội)."}, {"l": 0, "b": true, "t": "Yếu tố cấu thành: Hầu hết sự hài hước đều dựa trên sự bất đồng bộ, mâu thuẫn hoặc không nhất quán (incongruity) và sau đó được giải quyết bất ngờ ở phần \"câu kết\" (punch line)."}]}, {"n": 15, "q": "Tác động của âm nhạc đến hành vi con người là gì? Tác động của MV \"There's no one at all\" của Sơn Tùng đối với người nghe dựa trên lý thuyết cấy trồng truyền thông (Cultivation Theory) do George Gerbner đề xuất năm 1969 được thể hiện như thế nào?", "a": [{"l": 0, "b": true, "t": "Tác động của âm nhạc: Âm nhạc ảnh hưởng lớn đến tâm trạng (mood management), khơi gợi ký ức (memory cue), điều tiết cảm xúc và định hình hành vi của người nghe."}, {"l": 0, "b": true, "t": "Liên hệ với Lý thuyết Cấy trồng (Cultivation Theory): Lý thuyết này cho rằng việc tiếp xúc lặp đi lặp lại với các nội dung truyền thông (ví dụ: hình ảnh bạo lực, tiêu cực trong một sản phẩm âm nhạc) sẽ \"cấy trồng\" vào tâm trí người xem (đặc biệt là giới trẻ) một thế giới quan lệch lạc, khiến họ xem bạo lực hoặc sự bi lụy là điều bình thường hoặc chấp nhận được trong cuộc sống."}]}, {"n": 16, "q": "Tại sao con người tìm kiếm các nội dung thể thao trên truyền thông, và bản chất tâm lý của trải nghiệm đó là gì?", "a": [{"l": 0, "b": true, "t": "Con người tìm đến thể thao vì tính chất trực tiếp, chưa kịch bản trước và kết quả còn bỏ ngỏ."}, {"l": 0, "b": true, "t": "Bản chất tâm lý: Mang động lực về cảm xúc (giải trí, kích thích sự hưng phấn, nâng cao lòng tự trọng, sự trốn chạy thực tại), nhận thức (học hỏi, thẩm mỹ) và xã hội (sự gắn kết nhóm, đồng cảm)."}]}, {"n": 17, "q": "Sự đồng cảm (empathy) nâng cao mức độ tận hưởng truyền thông của chúng ta như thế nào?", "a": [{"l": 0, "b": true, "t": "Sự đồng cảm cho phép chúng ta \"cảm nhận thay\" những gì nhân vật đang trải qua (sự đồng hóa cảm xúc). Điều này làm tăng sự gắn kết với cốt truyện: ta thấy vui hơn khi nhân vật hài hước thành công, hoặc cảm thấy hồi hộp, thắt ruột khi đội bóng yêu quý của ta đang bị dẫn trước ở những phút cuối."}]}, {"n": 18, "q": "Bạn suy nghĩ như thế nào về nhận định: \"Truyền hình đã thay đổi thể thao theo vô số cách\"?", "a": [{"l": 0, "b": true, "t": "Nhận định này hoàn toàn chính xác. Truyền hình đã biến thể thao từ các hoạt động thi đấu thuần túy thành một ngành công nghiệp giải trí lớn:"}, {"l": 0, "b": true, "t": "Thay đổi cấu trúc giải đấu (thời gian nghỉ giữa hiệp để chèn quảng cáo)."}, {"l": 0, "b": true, "t": "Làm tăng tính rực rỡ, nhiều màu sắc thị giác hơn (sân vận động, màn hình điểm số điện tử)."}, {"l": 0, "b": true, "t": "Biến Thế vận hội và các giải đấu lớn thành các sự kiện truyền thông toàn cầu trị giá hàng tỷ đô la."}]}, {"n": 19, "q": "Cách thể hiện phụ nữ trên truyền thông thực sự có thể gây hại như thế nào đối với những phụ nữ tiếp xúc với các hình tượng đó?", "a": [{"l": 0, "b": true, "t": "Việc truyền thông liên tục lặp lại các khuôn mẫu: phụ nữ phải cực kỳ gầy, trẻ mãi không già, hoặc gắn liền với vai trò nội trợ thụ động sẽ gây áp lực tâm lý lớn:"}, {"l": 0, "b": true, "t": "Dẫn đến các chứng rối loạn ăn uống (như trường hợp nghiên cứu ở đảo Fiji sau khi có TV)."}, {"l": 0, "b": true, "t": "Giảm tự tin về ngoại hình, tự ti về cơ thể (body image issues), và củng cố sự bất bình đẳng giới trong xã hội."}]}, {"n": 20, "q": "Tác động của định kiến giới trên truyền thông là gì? Cho ví dụ.", "a": [{"l": 0, "b": true, "t": "Tác động: Việc tiếp xúc nhiều với định kiến giới khiến người xem củng cố các hành vi áp đặt theo giới tính (sex-typed behavior), duy trì cái nhìn rập khuôn rằng nam giới phải lạnh lùng, mạnh mẽ, cơ bắp còn nữ giới phải yếu đuối, phục tùng hoặc chỉ lo việc gia đình."}, {"l": 0, "b": true, "t": "Ví dụ: Quảng cáo thường vẽ nên hình ảnh người chồng lóng ngóng, không biết thay tã cho con, trong khi người mẹ phải gánh vác toàn bộ việc nhà (\"Mom as Superwoman\" / \"Dad as Buffoon\")."}]}, {"n": 21, "q": "Gia đình được khắc họa trên truyền hình như thế nào? So sánh với đời thực.", "a": [{"l": 0, "b": true, "t": "Cơ sở Lý thuyết: Social Representation Theory & Cultivation Theory."}, {"l": 0, "b": true, "t": "Giải pháp & Hành động:"}, {"l": 0, "b": true, "t": "Trên truyền hình: Gia đình thường được khắc họa theo hai cực: Hoặc là hình mẫu lý tưởng hoàn hảo (kinh tế khá giả, nhà đẹp, các thành viên yêu thương thấu hiểu nhau tuyệt đối) hoặc là bức tranh đầy kịch tính, ngoại tình, mâu thuẫn thế hệ gay gắt (phim truyền hình giờ vàng)."}, {"l": 0, "b": true, "t": "So sánh với đời thực: Đời thực phức tạp, nhiều gam màu xám hơn, bao gồm áp lực tài chính vụn vặt hàng ngày, sự mệt mỏi âm thầm và những khoảng lặng trong giao tiếp thay vì những màn kịch tính cao trào liên tục."}, {"l": 0, "b": true, "t": "Dự báo Phản ứng: Khán giả xem nhiều gia đình hoàn hảo trên TV dễ có xu hướng bất mãn với cuộc sống gia đình thực tế của chính mình (Relational Discontent)."}]}, {"n": 22, "q": "Mô hình Bốn giai đoạn thể hiện nhóm thiểu số được áp dụng như thế nào trong trường hợp các nhóm thiểu số?", "a": [{"l": 0, "b": true, "t": "Cơ sở Lý thuyết: Four Stages of Minority Portrayals Model (Clark, 1969)."}, {"l": 0, "b": true, "t": "Giải pháp & Hành động:"}, {"l": 0, "b": true, "t": "Mô hình gồm 4 giai đoạn:"}, {"l": 0, "b": false, "t": "1. Non-recognition (Không thừa nhận): Nhóm thiểu số hoàn toàn biến mất khỏi truyền thông (như thể họ không tồn tại)."}, {"l": 0, "b": false, "t": "2. Ridicule (Chế giễu): Xuất hiện nhưng bị đặt vào các vai diễn hề hụt, ngớ ngẩn hoặc làm trò cười cho đa số."}, {"l": 0, "b": false, "t": "3. Regulation (Quản lý/Khuôn mẫu): Được xuất hiện nhiều hơn nhưng bị đóng khung trong các vai trò nhất định (ví dụ: người giúp việc, tội phạm)."}, {"l": 0, "b": false, "t": "4. Respect (Tôn trọng): Được khắc họa đa chiều, công bằng, bình đẳng và có chiều sâu như các nhóm đa số khác."}, {"l": 0, "b": true, "t": "Dự báo Phản ứng: Sự chuyển dịch qua các giai đoạn này phản ánh sự tiến bộ về văn minh xã hội và quyền con người trong ngành công nghiệp truyền thông toàn cầu."}]}, {"n": 23, "q": "Các nhóm sau được khắc họa như thế nào trong truyền thông: Thiểu số tính dục, Người cao tuổi, Người khuyết tật, Người có đức tin, Ngành nghề?", "a": [{"l": 0, "b": true, "t": "Cơ sở Lý thuyết: Framing & Stereotyping in Media."}, {"l": 0, "b": true, "t": "Giải pháp & Hành động:"}, {"l": 0, "b": true, "t": "Thiểu số tính dục (LGBTQ+): Đang dịch chuyển từ giai đoạn bị chế giễu sang được tôn trọng với các hình tượng đa chiều hơn trong phim ảnh hiện đại."}, {"l": 0, "b": true, "t": "Người cao tuổi: Thường bị rập khuôn là yếu ớt, lạc hậu, chậm chạp công nghệ, hoặc ngược lại là người ông/bà hiền hậu thái quá (ít khi được khắc họa là người năng động, quyến rũ)."}, {"l": 0, "b": true, "t": "Người khuyết tật: Thường rơi vào hai thái cực: Bi thảm hóa đáng thương hoặc phi thường hóa thành siêu nhân (inspiring porn), thiếu sự nhìn nhận bình thường hóa."}, {"l": 0, "b": true, "t": "Tôn trọng đức tin / Ngành nghề: Các ngành nghề uy tín (bác sĩ, công an) thường được khắc họa lý tưởng hóa, trong khi một số tôn giáo có thể bị gán ghép định kiến nếu thiếu hiểu biết văn hóa."}, {"l": 0, "b": true, "t": "Dự báo Phản ứng: Công chúng thuộc các nhóm này ngày càng đòi hỏi sự đại diện chính xác, tôn trọng và công bằng từ các nhà sản xuất nội dung."}]}, {"n": 24, "q": "Theo trải nghiệm của bạn với truyền thông, bạn nghĩ Việt Nam thường được khắc họa với thế giới như thế nào? Cho ví dụ.", "a": [{"l": 0, "b": true, "t": "Cơ sở Lý thuyết: International News Framing & Nation Branding."}, {"l": 0, "b": true, "t": "Giải pháp & Hành động:"}, {"l": 0, "b": true, "t": "Việt Nam thường được khắc họa qua hai lăng kính chính trên truyền thông quốc tế:"}, {"l": 0, "b": false, "t": "1. Lăng kính lịch sử - chiến tranh: Gắn liền với hình tượng chiến tranh Việt Nam, các di tích lịch sử và sự kiên cường."}, {"l": 0, "b": false, "t": "2. Lăng kính hiện đại - văn hóa - du lịch: Điểm đến du lịch an toàn, ẩm thực đường phố phong phú (Phở, Bánh mì), đất nước đang phát triển năng động, thân thiện và ổn định chính trị."}, {"l": 0, "b": true, "t": "Ví dụ: Các chương trình du lịch ẩm thực quốc tế (như Anthony Bourdain với cố đầu bếp nổi tiếng, hoặc các vlogger du lịch toàn cầu) khen ngợi văn hóa ẩm thực và sự hiếu khách của con người Việt Nam."}, {"l": 0, "b": true, "t": "Dự báo Phản ứng: Tạo ra hình ảnh quốc gia tích cực, thu hút lượng lớn khách du lịch quốc tế và các nhà đầu tư nước ngoài."}]}, {"n": 25, "q": "Mục đích trực tiếp nhất của một quảng cáo là gì?", "a": [{"l": 0, "b": true, "t": "Cơ sở Lý thuyết: AIDA Model (Attention, Interest, Desire, Action) & Persuasion Theory."}, {"l": 0, "b": true, "t": "Giải pháp & Hành động:"}, {"l": 0, "b": true, "t": "Mục đích trực tiếp nhất của quảng cáo là thu hút sự chú ý (Attention) và ghi khắc vào trí nhớ người tiêu dùng (Brand Awareness), từ đó kích hoạt mong muốn (Desire) dẫn đến hành vi mua sắm hoặc thay đổi thái độ đối với thương hiệu."}, {"l": 0, "b": true, "t": "Dự báo Phản ứng: Khán giả nhận diện được thông điệp thương hiệu nhưng mức độ chuyển đổi thực tế còn phụ thuộc vào tính thuyết phục của sản phẩm và nhu cầu cá nhân."}]}, {"n": 26, "q": "Nghiên cứu tình huống (Case study): 1. Nhà sản xuất phát triển ý tưởng thế nào? 2. Các kháng cự/lôi cuốn tâm lý nào được sử dụng trong quảng cáo này?", "a": [{"l": 0, "b": true, "t": "Cơ sở Lý thuyết: Elaboration Likelihood Model (ELM) & Emotional Appeal Strategies."}, {"l": 0, "b": true, "t": "Giải pháp & Hành động:"}, {"l": 0, "b": true, "t": "(Áp dụng cấu trúc phân tích cho một quảng cáo Tết kinh điển - ví dụ: Quảng cáo Tết của Kinh Đô/Biti's):"}, {"l": 0, "b": false, "t": "1. Phát triển ý tưởng: Nhà sản xuất kể một câu chuyện xúc động về sự sum họp gia đình, nỗi lòng người xa quê (Storytelling). Họ khơi gợi nhu cầu thuộc về (Belongingness), nỗi sợ cô đơn (Fear of missing out) và sự khao khát kết nối tình thân."}, {"l": 0, "b": false, "t": "2. Kháng cự/Lôi cuốn tâm lý (Psychological Appeals): Sử dụng Emotional Appeal (lôi cuốn bằng cảm xúc qua hình ảnh người cha già ngóng con) để kích hoạt System 1, vượt qua hàng rào phòng thủ lý trí (System 2) của người tiêu dùng, khiến họ gắn kết cảm xúc sản phẩm với giá trị gia đình."}, {"l": 0, "b": true, "t": "Dự báo Phản ứng: Khán giả cảm thấy chạm đến cảm xúc sâu kín, dễ rơi nước mắt và có xu hướng chia sẻ video rộng rãi (Viral marketing)."}]}, {"n": 27, "q": "Có bao nhiêu giai đoạn trong quá trình xử lý quảng cáo?", "a": [{"l": 0, "b": true, "t": "Cơ sở Lý thuyết: Information Processing Model of Advertising (McGuire's Communication/Persuasion Matrix)."}, {"l": 0, "b": true, "t": "Giải pháp & Hành động:"}, {"l": 0, "b": true, "t": "Quá trình xử lý quảng cáo gồm 6 giai đoạn cơ bản:"}, {"l": 0, "b": false, "t": "1. Tiếp xúc (Exposure)"}, {"l": 0, "b": false, "t": "2. Chú ý (Attention)"}, {"l": 0, "b": false, "t": "3. Hiểu/Nhận thức (Comprehension)"}, {"l": 0, "b": false, "t": "4. Chấp nhận/Đồng ý (Yielding/Acceptance)"}, {"l": 0, "b": false, "t": "5. Lưu trữ vào bộ nhớ (Retention)"}, {"l": 0, "b": false, "t": "6. Hành động (Behavior/Action)"}, {"l": 0, "b": true, "t": "Dự báo Phản ứng: Nếu quảng cáo bị gãy ở bất kỳ giai đoạn nào (ví dụ: người xem không chú ý hoặc không hiểu), quá trình chuyển đổi sẽ thất bại ngay lập tức."}]}, {"n": 28, "q": "Ba thị trường riêng biệt dành cho trẻ em là gì? Quan điểm của bạn về đạo đức trong quảng cáo hướng đến trẻ em như thế nào?", "a": [{"l": 0, "b": true, "t": "Cơ sở Lý thuyết: Consumer Socialization of Children Theory & Media Ethics."}, {"l": 0, "b": true, "t": "Giải pháp & Hành động:"}, {"l": 0, "b": true, "t": "Ba thị trường trẻ em:"}, {"l": 0, "b": false, "t": "1. Primary Market: Thị trường trực tiếp chi tiêu bằng tiền túi của trẻ (đồ ăn vặt, đồ chơi nhỏ)."}, {"l": 0, "b": false, "t": "2. Influence Market (Nag Factor): Thị trường tác động gián tiếp (trẻòi vòi vĩnh, ép buộc cha mẹ mua xe đạp, máy tính, đồ chơi lớn)."}, {"l": 0, "b": false, "t": "3. Future Market: Thị trường khách hàng tiềm năng trong tương lai khi trẻ trưởng thành (xây dựng lòng trung thành thương hiệu từ bé)."}, {"l": 0, "b": true, "t": "Đạo đức trong quảng cáo hướng đến trẻ em: Trẻ em chưa có năng lực tư duy phản biện (System 2) hoàn thiện, dễ bị lừa dối bởi hình ảnh đồ họa phóng đại. Do đó, quảng cáo hướng tới trẻ em đòi hỏi tiêu chuẩn đạo đức cực kỳ khắt khe, cấm các thủ thuật thao túng tâm lý độc hại, ép buộc mua hàng hoặc lừa dối công năng sản phẩm."}, {"l": 0, "b": true, "t": "Dự báo Phản ứng: Các cơ quan quản lý và phụ huynh ngày càng siết chặt luật lệ đối với quảng cáo nhắm vào trẻ em trên không gian mạng."}]}, {"n": 29, "q": "Gài cắm sản phẩm (product placement) là gì? Cho một ví dụ. Bạn có nghĩ rằng product placement là đạo đức không? Giải thích.", "a": [{"l": 0, "b": true, "t": "Cơ sở Lý thuyết: Implicit Persuasion & Subliminal/Unconscious Influence."}, {"l": 0, "b": true, "t": "Giải pháp & Hành động:"}, {"l": 0, "b": true, "t": "Khái niệm: Là hình thức đưa sản phẩm hoặc thương hiệu vào phim ảnh, MV, trò chơi điện tử một cách tự nhiên như một phần của bối cảnh thay vì quảng cáo lộ liễu."}, {"l": 0, "b": true, "t": "Ví dụ: Nhân vật chính trong phim Hollywood uống một nhãn hiệu nước ngọt cụ thể trong một cảnh quay căng thẳng."}, {"l": 0, "b": true, "t": "Tính đạo đức: Product placement hoàn toàn đạo đức nếu được thực hiện minh bạch và không bóp méo nội dung nghệ thuật. Tuy nhiên, nếu lạm dụng lén lút, thao túng nhận thức ngầm mà người xem không nhận ra đó là quảng cáo trả tiền thì vi phạm nguyên tắc minh bạch thông tin."}, {"l": 0, "b": true, "t": "Dự báo Phản ứng: Khán giả hiện đại rất nhạy cảm và thường đánh giá cao các màn gài cắm sản phẩm tinh tế, khéo léo, ngược lại sẽ thấy khó chịu nếu quá lộ liễu, phô trương."}]}, {"n": 30, "q": "Tin tức là gì và tin tức cứng (hard news) là gì? Với quá nhiều phương tiện hiện nay, đâu là nguồn chính mà người lớn chủ yếu dùng để tiếp nhận tin tức?", "a": [{"l": 0, "b": true, "t": "Cơ sở Lý thuyết: Journalism Studies & News Selection Theory."}, {"l": 0, "b": true, "t": "Giải pháp & Hành động:"}, {"l": 0, "b": true, "t": "Tin tức (News): Thông tin mới về các sự kiện có thật, quan trọng và thu hút sự quan tâm của công chúng."}, {"l": 0, "b": true, "t": "Tin tức cứng (Hard News): Các bản tin nghiêm túc về chính trị, kinh tế, tội phạm, thảm họa, chiến tranh, ngoại giao – đòi hỏi tính chính xác, kịp thời và tác động lớn đến xã hội."}, {"l": 0, "b": true, "t": "Nguồn tiếp nhận chính của người lớn hiện nay: Mạng xã hội (Facebook, X/Twitter, YouTube) kết hợp với các cổng thông tin báo điện tử chính thống trên thiết bị di động (smartphone)."}, {"l": 0, "b": true, "t": "Dự báo Phản ứng: Sự dịch chuyển sang mạng xã hội giúp tiếp nhận tin tức nhanh chóng nhưng cũng làm tăng nguy cơ tiếp cận tin giả (fake news) do thuật toán giật gân."}]}, {"n": 31, "q": "Đặc điểm chính của một sự kiện đáng đưa tin (newsworthy event) là gì? Tìm một bản tin, phân tích tại sao bản tin đó được coi là đáng đưa tin và chỉ ra mặt tích cực, tiêu cực của từng đặc điểm.", "a": [{"l": 0, "b": true, "t": "Cơ sở Lý thuyết: News Values Theory (Galtung & Ruge)."}, {"l": 0, "b": true, "t": "Giải pháp & Hành động:"}, {"l": 0, "b": true, "t": "Các đặc điểm chính (News Values): Tính thời sự (Timeliness), Tác động lớn (Impact), Sự gần gũi (Proximity), Tính bất thường/Mới lạ (Novelty/Oddity), Sự nổi tiếng của nhân vật (Prominence), Xung đột (Conflict)."}, {"l": 0, "b": true, "t": "Ví dụ phân tích: Bản tin về việc Phát hiện loại vật liệu siêu dẫn mới ở nhiệt độ phòng."}, {"l": 0, "b": true, "t": "Đặc điểm: Novelty (Mới lạ) & Impact (Tác động cách mạng công nghệ)."}, {"l": 0, "b": true, "t": "Mặt tích cực: Kích thích khoa học phát triển, mở rộng tri thức nhân loại."}, {"l": 0, "b": true, "t": "Mặt tiêu cực: Dễ bị truyền thông thổi phồng quá mức (hype), dẫn đến hiểu lầm sai lệch cho công chúng không chuyên môn."}, {"l": 0, "b": true, "t": "Dự báo Phản ứng: Công chúng dễ bị cuốn hút bởi các tiêu đề giật gân dựa trên các giá trị tin tức này nếu cơ quan báo chí thiếu kiểm chứng đạo đức."}]}, {"n": 32, "q": "Các đặc điểm phụ của một sự kiện đáng đưa tin và yêu cầu của Sound bites", "a": [{"l": 0, "b": false, "t": "1. Các đặc điểm phụ của một sự kiện đáng đưa tin (Secondary characteristics of a newsworthy event):"}, {"l": 0, "b": false, "t": "Ngoài những yếu tố chính như tính thời sự, mức độ ảnh hưởng và sự gần gũi, một sự kiện còn có những đặc điểm phụ:"}, {"l": 1, "b": true, "t": "Tính không gây khó chịu"}, {"l": 0, "b": false, "t": "Độ tin cậy"}, {"l": 0, "b": false, "t": "Đoạn âm thanh ̣sound bites"}, {"l": 0, "b": false, "t": "Mối liên hệ địa phương"}, {"l": 0, "b": false, "t": "2. Yêu cầu của Sound bites (đoạn trích phát biểu ngắn):"}, {"l": 0, "b": false, "t": "Sound bites là những đoạn phát biểu ngắn được trích từ lời nói của một người và sử dụng trong bản tin truyền hình, video hoặc các sản phẩm truyền thông."}, {"l": 0, "b": false, "t": "Một sound bite tốt cần:"}, {"l": 2, "b": true, "t": "Ngắn gọn, thường khoảng 10–15 giây."}, {"l": 2, "b": true, "t": "Nội dung rõ ràng, dễ hiểu."}, {"l": 2, "b": true, "t": "Có thông điệp nổi bật, đáng nhớ."}, {"l": 2, "b": true, "t": "Tạo cảm xúc hoặc thu hút sự chú ý."}, {"l": 2, "b": true, "t": "Liên quan trực tiếp đến chủ đề đang đưa tin."}, {"l": 2, "b": true, "t": "Có thể đứng độc lập mà người xem vẫn hiểu được ý chính."}, {"l": 2, "b": true, "t": "Câu chuyện được chia thành nhiều phần nhỏ phù hợp với bản tin truyền ngắn hoặc báo in"}, {"l": 0, "b": false, "t": "Ví dụ: Một chính trị gia phát biểu: \"Chúng ta cần tạo thêm việc làm để mọi người có cơ hội xây dựng một cuộc sống tốt đẹp hơn.\""}]}, {"n": 33, "q": "Truyền thông tin tức tạo ra thực tế được nhận thức như thế nào?", "a": [{"l": 0, "b": false, "t": "Truyền thông tin tức với vai trò kiến tạo thực tại được nhận thức. Truyền thông đại chúng đóng vai trò trung gian giữa công chúng và một thực tại khách quan nào đó ngoài thế giới."}, {"l": 0, "b": false, "t": "Tuy nhiên những gì xuất hiện trên các phương tiện truyền thông là sự diễn giải của các nhà báo và nhà sản xuất tin tức về thực tế nó, thể hiện quả cả chủ đề vả mức độ đưa tin của họ. Tức là"}, {"l": 0, "b": false, "t": "Làm thế nào để thúc đẩy quá trình này?"}, {"l": 0, "b": false, "t": "Truyền thông cần lựa chọn thông tin phù hợp, sử dụng hình ảnh chân thực, tiêu đề rõ ràng, cung cấp bối cảnh và lặp lại những thông điệp quan trọng một cách nhất quán."}, {"l": 0, "b": false, "t": "Ví dụ: Khi truyền thông liên tục đưa tin về ô nhiễm không khí, kèm theo hình ảnh khói bụi và các số liệu về chất lượng không khí, công chúng sẽ chú ý hơn đến vấn đề môi trường và nhận thức được mức độ nghiêm trọng của nó."}]}, {"n": 34, "q": "Điều gì giúp các chính trị gia phương Tây thu hẹp khoảng cách với công chúng?", "a": [{"l": 0, "b": false, "t": "Một trong những cách hiệu quả là cá nhân hóa hình ảnh chính trị gia (Personalization) và sử dụng truyền thông để giao tiếp trực tiếp, gần gũi hơn với người dân."}, {"l": 0, "b": false, "t": "Các cách thực hiện:"}, {"l": 1, "b": true, "t": "Xuất hiện trên truyền hình, chương trình trò chuyện và phỏng vấn."}, {"l": 1, "b": true, "t": "Sử dụng mạng xã hội để tương tác trực tiếp."}, {"l": 1, "b": true, "t": "Tham gia các buổi gặp gỡ, đối thoại với người dân."}, {"l": 1, "b": true, "t": "Chia sẻ cuộc sống, cảm xúc và câu chuyện cá nhân."}, {"l": 1, "b": true, "t": "Sử dụng ngôn ngữ gần gũi, dễ hiểu thay vì chỉ phát biểu theo phong cách chính trị trang trọng."}, {"l": 0, "b": false, "t": "Ví dụ: Cựu Tổng thống Mỹ Barack Obama sử dụng Facebook, Twitter và YouTube trong các chiến dịch tranh cử để truyền tải thông điệp, tiếp cận giới trẻ và khuyến khích người dân tham gia chính trị."}, {"l": 0, "b": false, "t": "Vai trò của truyền thông: Giúp chính trị gia xây dựng hình ảnh thân thiện, tăng tương tác, tạo cảm giác gần gũi và giúp công chúng cảm thấy tiếng nói của mình được lắng nghe."}]}, {"n": 35, "q": "So sánh và đối chiếu những nội dung nào được truyền thông đưa tin đậm đặc và nội dung nào ít được đưa tin trong các chiến dịch tranh cử chính trị?", "a": [{"l": 0, "b": false, "t": "Trong các chiến dịch tranh cử, truyền thông thường đưa tin nhiều về kết quả thăm dò, hình ảnh ứng viên, tranh cãi, bê bối và các sự kiện vận động tranh cử."}, {"l": 0, "b": false, "t": "Ngược lại, những nội dung như chính sách chi tiết, kế hoạch dài hạn và giải pháp cho các vấn đề xã hội thường ít được chú ý."}, {"l": 0, "b": false, "t": "Nguyên nhân là vì những tin tức gây tranh cãi và hấp dẫn thường thu hút nhiều người xem hơn."}]}, {"n": 36, "q": "Chiến lược truyền thông tin tức nào được các ứng viên sử dụng thường xuyên nhất và tại sao?", "a": [{"l": 0, "b": false, "t": "Một trong những chiến lược phổ biến nhất là tổ chức các sự kiện được dàn dựng nhằm thu hút sự chú ý của truyền thông (Pseudo-events)."}, {"l": 0, "b": false, "t": "Các ứng viên chủ động tổ chức sự kiện để báo chí đưa tin, từ đó truyền tải thông điệp, quảng bá hình ảnh và tiếp cận nhiều cử tri mà không phải trả tiền quảng cáo trực tiếp."}]}, {"n": 37, "q": "Chiến lược truyền thông mà các chính trị gia sử dụng để giao tiếp với công chúng là gì? Mặt tích cực/tiêu cực của việc sử dụng đó là gì?", "a": [{"l": 1, "b": true, "t": "Các chính trị gia sử dụng nhiều phương tiện truyền thông để giao tiếp với công chúng như truyền hình, báo chí, radio, mạng xã hội, họp báo, phỏng vấn và quảng cáo chính trị. Ngày nay, các nền tảng như Facebook, TikTok và X được sử dụng phổ biến để truyền tải thông điệp và tương tác trực tiếp với người dân."}, {"l": 0, "b": false, "t": "Mặt tích cực:"}, {"l": 1, "b": true, "t": "Giúp chính trị gia tiếp cận nhiều người trong thời gian ngắn."}, {"l": 1, "b": true, "t": "Chia sẻ thông tin về chính sách, hoạt động và kế hoạch."}, {"l": 1, "b": true, "t": "Người dân dễ dàng tiếp cận thông tin và bày tỏ ý kiến."}, {"l": 1, "b": true, "t": "Tăng cường sự tương tác giữa chính trị gia và công chúng."}, {"l": 0, "b": false, "t": "Mặt tiêu cực:"}, {"l": 1, "b": true, "t": "Có thể sử dụng truyền thông để định hướng hoặc thao túng dư luận."}, {"l": 1, "b": true, "t": "Tin giả và thông tin sai lệch có thể lan truyền nhanh chóng."}, {"l": 1, "b": true, "t": "Thông điệp chính trị có thể bị phóng đại hoặc thiên vị."}, {"l": 1, "b": true, "t": "Chính trị gia có thể chú trọng xây dựng hình ảnh cá nhân hơn là giải quyết các vấn đề thực tế."}]}, {"n": 38, "q": "Một số vấn đề gặp phải trong các nghiên cứu về tác động của bạo lực trên truyền thông là gì?", "a": [{"l": 0, "b": false, "t": "Có một số vấn đề trong các nghiên cứu về tác động của bạo lực trên truyền thông:"}, {"l": 1, "b": false, "t": "1. Khó chứng minh nguyên nhân và kết quả: Rất khó chứng minh rằng việc xem nội dung bạo lực trực tiếp khiến con người trở nên bạo lực."}, {"l": 1, "b": false, "t": "2. Sự khác biệt giữa các cá nhân: Mỗi người phản ứng khác nhau tùy thuộc vào độ tuổi, tính cách, hoàn cảnh gia đình và môi trường sống."}, {"l": 1, "b": false, "t": "3. Thí nghiệm thiếu tính thực tế: Một số nghiên cứu được thực hiện trong phòng thí nghiệm nên có thể không phản ánh chính xác tình huống ngoài đời thực."}, {"l": 1, "b": false, "t": "4. Vấn đề đạo đức: Các nhà nghiên cứu không thể cho người tham gia, đặc biệt là trẻ em, tiếp xúc với quá nhiều nội dung bạo lực trong thời gian dài."}, {"l": 1, "b": false, "t": "5. Các yếu tố ảnh hưởng khác: Hoàn cảnh gia đình, môi trường xã hội và trải nghiệm cá nhân cũng có thể ảnh hưởng đến hành vi hung hăng."}, {"l": 1, "b": false, "t": "6. Cách đánh giá khác nhau: Các nhà nghiên cứu có thể không thống nhất về định nghĩa bạo lực và cách đo lường tác động của nó."}]}, {"n": 39, "q": "Xem bạo lực truyền thông có làm con người hung hăng hơn?", "a": [{"l": 0, "b": false, "t": "có, nhưng không phải tác động trực tiếp 1:1 mà là tích lũy qua thời gian thông qua các cơ chế:"}, {"l": 1, "b": false, "t": "1. Mô hình Bạo lực Tổng quát (GAM): Bạo lực truyền thông kích hoạt các kịch bản nhận thức (scripts), cảm xúc giận dữ và trạng thái kích thích sinh lý, dần làm thay đổi nhân cách dài hạn."}, {"l": 1, "b": false, "t": "2. Học tập Xã hội (Bandura): Con người học cách ứng xử bạo lực khi thấy hành vi này trên phim/game được thưởng, hợp thức hóa hoặc không chịu hậu quả."}, {"l": 1, "b": false, "t": "3. Hiệu ứng Mồi gợi (Priming): Nội dung bạo lực làm hạ thấp rào cản kiềm chế (disinhibition), khiến cá nhân dễ bộc phát hành vi hung hăng khi có mâu thuẫn đời thực."}]}, {"n": 40, "q": "Hiệu ứng nào giải thích sự dửng dưng trước bạo lực đời thực?", "a": [{"l": 0, "b": false, "t": "Hai hiệu ứng chính giải thích sự vô cảm này gồm:"}, {"l": 1, "b": false, "t": "1. Hiệu ứng Giải cảm (Desensitization Effect) – Cốt lõi:"}, {"l": 1, "b": true, "t": "Sinh lý: Tiếp xúc bạo lực quá nhiều làm giảm phản ứng thần kinh (không còn giật mình, sợ hãi, tim đập nhanh)."}, {"l": 1, "b": true, "t": "Nhận thức: Bạo lực bị \"bình thường hóa\", làm xói mòn khả năng đồng cảm với nỗi đau của nạn nhân ngoài đời thực."}, {"l": 1, "b": false, "t": "2. Kiệt quệ vì Đồng cảm (Compassion Fatigue):"}, {"l": 1, "b": true, "t": "Do tiếp nhận quá tải thông tin bạo lực/tiêu cực từ truyền thông, não bộ tự bật mơ-phe-mơ-tơ ngắt kết nối cảm xúc (cơ chế tự vệ) để tránh bị quá tải căng thẳng (burnout)."}]}, {"n": 41, "q": "Điều gì khiến một người cảm thấy thích thú khi xem các nội dung bạo lực trên truyền thông?", "a": [{"l": 0, "b": false, "t": "Có nhiều lý do khiến con người thích xem nội dung bạo lực:"}, {"l": 1, "b": true, "t": "Sự phấn khích: Bạo lực tạo cảm giác hồi hộp và kích thích."}, {"l": 1, "b": true, "t": "Giải trí: Phim hành động và trò chơi chiến đấu mang lại sự hấp dẫn."}, {"l": 1, "b": true, "t": "Tò mò: Muốn khám phá những sự kiện gây sốc."}, {"l": 1, "b": true, "t": "Học hỏi: Thích quan sát các nhân vật mạnh mẽ."}, {"l": 1, "b": true, "t": "Giải tỏa cảm xúc: Một số người cảm thấy thoải mái khi xem bạo lực giả tưởng."}, {"l": 1, "b": true, "t": "Cạnh tranh: Thích chiến thắng trong các trò chơi đối kháng."}]}, {"n": 42, "q": "What are common violent elements in video games? Could you give some examples?", "a": [{"l": 0, "b": false, "t": "Các yếu tố bạo lực phổ biến trong trò chơi điện tử bao gồm:"}, {"l": 1, "b": true, "t": "Bạo lực thể chất: Đấm, đá, đánh nhau."}, {"l": 1, "b": true, "t": "Bạo lực bằng vũ khí: Súng, dao, kiếm, chất nổ."}, {"l": 1, "b": true, "t": "Giết chóc: Tiêu diệt nhân vật hoặc đối thủ."}, {"l": 1, "b": true, "t": "Máu và thương tích: Hình ảnh máu, vết thương."}, {"l": 1, "b": true, "t": "Phá hoại: Phá hủy nhà cửa, phương tiện."}, {"l": 1, "b": true, "t": "Bạo lực ngôn từ: Đe dọa, xúc phạm."}, {"l": 1, "b": true, "t": "Chiến tranh: Các trận chiến giữa quân đội hoặc nhóm đối thủ."}, {"l": 0, "b": false, "t": "Ví dụ: GTA V, Mortal Kombat, Call of Duty và Valorant."}]}];

];
const PALETTE = [["#5aa9e6","#2f7fc0"],["#7ea3f2","#4a6fd0"],["#4fbfd8","#16809a"],["#6fc3ea","#2a86b8"],["#58c7bd","#1c7d75"],["#92a9f5","#5b72d4"]];
const CHEERS = ["Nhớ chưa nè? 🤔","Cố lên bạn ơi! 💪","Đoán thử xem~ 🌟","Hít thở, nghĩ nào! ☁️","Bạn làm được mà! 💖","Gợi ý: nhớ từ khóa! 🔑","Thử nói to lên xem! 🗣️","Ngầu quá đi~ ✨"];

function build(list){ deck = shuffle(list); idx = 0; $("done").style.display="none"; render(); }
function render(){
  const c = deck[idx], card = $("card");
  card.classList.add("nt"); card.classList.remove("flip"); void card.offsetWidth; card.classList.remove("nt");
  const sc = $("scene"); sc.classList.remove("pop"); void sc.offsetWidth; sc.classList.add("pop");
  if(!c){ showDone(); return; }
  const pi = (c.n*7 + idx) % PALETTE.length;
  document.documentElement.style.setProperty("--c", PALETTE[pi][0]);
  document.documentElement.style.setProperty("--cd", PALETTE[pi][1]);
  const m = MASCOTS[Math.floor(Math.random()*MASCOTS.length)];
  $("mascot").innerHTML = m(); $("mini").innerHTML = m();
  $("bubble").textContent = CHEERS[Math.floor(Math.random()*CHEERS.length)];
  $("fnum").textContent = $("bnum").textContent = "Câu " + c.n;
  const q = $("q"); q.textContent = c.q;
  q.className = "qtxt" + (c.q.length > 200 ? " xs" : c.q.length > 120 ? " s" : "");
  $("a").innerHTML = '<div class="miniq">' + esc(c.q) + '</div>' + c.a.map(it => '<div class="it' + (it.b?' b':'') + ' l' + Math.min(it.l,4) + '">' + esc(it.t) + '</div>').join("");
  $("a").scrollTop = 0;
  fit();
  updateStats();
}
function fit(){
  const a = $("a"), base = window.innerWidth < 560 ? 15.5 : 17.5;
  let fs = base;
  do { a.style.setProperty("--fs", fs+"px"); a.style.setProperty("--lh", (fs*1.95)+"px"); fs -= .5; }
  while(a.scrollHeight > a.clientHeight + 1 && fs >= 13);
}
window.addEventListener("resize", () => { if(deck[idx]) fit(); });
function updateStats(){
  const k = CARDS.filter(c => status[c.n]==="k").length, u = CARDS.filter(c => status[c.n]==="u").length;
  $("kn").textContent = k; $("un").textContent = u;
  $("pos").textContent = deck.length ? Math.min(idx+1, deck.length) : 0; $("tot").textContent = deck.length;
  $("bk").style.width = (k/CARDS.length*100) + "%"; $("bu").style.width = (u/CARDS.length*100) + "%";
}
function confetti(){
  const em = ["🎉","⭐","💙","✨","🫧","🐋","💎","🩵","🦋"];
  for(let i=0;i<34;i++){ const e=document.createElement("div"); e.className="fall"; e.textContent=em[i%em.length];
    e.style.left=Math.random()*100+"vw"; e.style.animationDuration=(2.5+Math.random()*2.5)+"s"; e.style.animationDelay=(Math.random()*.8)+"s";
    document.body.appendChild(e); setTimeout(()=>e.remove(),6500); }
}
function burst(btn, emoji){
  const r = btn.getBoundingClientRect();
  for(let i=0;i<7;i++){ const e=document.createElement("div"); e.className="rise"; e.textContent=emoji[i%emoji.length];
    e.style.left=(r.left + r.width/2 + (Math.random()-.5)*r.width*.6)+"px"; e.style.top=(r.top)+"px";
    e.style.setProperty("--dx",((Math.random()-.5)*110)+"px"); e.style.setProperty("--r",((Math.random()-.5)*60)+"deg");
    e.style.animationDelay=(i*0.05)+"s"; document.body.appendChild(e); setTimeout(()=>e.remove(),1500); }
}
function showDone(){
  const k = CARDS.filter(c => status[c.n]==="k").length, u = CARDS.filter(c => status[c.n]==="u").length;
  $("sum").textContent = "Đã thuộc " + k + " · Chưa thuộc " + u + " · Chưa đánh dấu " + (CARDS.length-k-u);
  $("done").style.display = "flex"; updateStats(); confetti();
}
function go(d){ if(!deck.length) return; if(idx+d >= deck.length){ idx = deck.length; showDone(); return; } idx = Math.max(0, idx+d); $("done").style.display="none"; render(); }
function mark(s){ const c = deck[idx]; if(!c) return; status[c.n] = s; save(); burst($(s==="k"?"bknow":"bdont"), s==="k" ? ["💖","✨","⭐"] : ["💭","💪","🌱"]); go(1); }
$("card").onclick = () => $("card").classList.toggle("flip");
$("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
$("bknow").onclick = () => mark("k"); $("bdont").onclick = () => mark("u");
$("shuf").onclick = () => build(deck.length ? deck : CARDS);
$("all").onclick = () => build(CARDS);
$("only").onclick = $("redo").onclick = () => { const l = CARDS.filter(c => status[c.n]==="u"); if(!l.length){ alert("Chưa có thẻ nào được đánh dấu 'Chưa thuộc'."); return; } build(l); };
$("again").onclick = () => build(CARDS);
$("rst").onclick = () => { if(confirm("Xóa toàn bộ tiến độ đã thuộc / chưa thuộc?")){ status = {}; save(); build(CARDS); } };
document.addEventListener("keydown", e => {
  if(e.code==="Space"||e.code==="Enter"){ e.preventDefault(); $("card").classList.toggle("flip"); }
  else if(e.code==="ArrowRight") go(1); else if(e.code==="ArrowLeft") go(-1);
  else if(e.key==="k"||e.key==="K") mark("k"); else if(e.key==="d"||e.key==="D") mark("u");
  else if(e.key==="s"||e.key==="S") build(deck.length?deck:CARDS);
});
build(CARDS);
</script>
</body>
</html>
